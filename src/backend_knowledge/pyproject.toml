[project]
name = "backend-knowledge"
version = "0.2.0"
description = "v0.2.0 PoC standalone backend knowledge tool (umbrella doc §1.2 G7 + ADR-0035)"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "DevHub", email = "devhub@example.com" }
]

dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",
    "cryptography==43.0.0",
    "python-multipart==0.0.20",
    "markdown-it-py==3.0.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend_knowledge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/backend_knowledge/tests"]
pythonpath = ["src"]
rootdir = "/home/yklee/repos/Devhub_example"
addopts = [
    "--ignore=vendor",
    "--ignore=backend-core",
    "--ignore=backend-ai",
    "--ignore=ai-workflow",
    "--ignore=frontend",
    "--ignore=docs",
]
