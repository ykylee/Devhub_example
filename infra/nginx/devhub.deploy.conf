upstream devhub_frontend {
    server frontend:3000;
}

upstream devhub_backend_core {
    server backend-core:8080;
}

# ADR-0019 Keycloak 단일화 (sprint claude/work_260519-k) — Hydra/Kratos 2 upstream 제거 + Keycloak 단일 upstream.
upstream devhub_keycloak {
    server keycloak:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Backend API calls must bypass Next.js build-time rewrites so deploy
    # images remain portable across hosts/environments.
    location /api/v1/ {
        proxy_pass http://devhub_backend_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Keycloak OIDC + admin-console + realm endpoints (ADR-0019 §4.2 환경설정 계약 정합).
    # backend Keycloak Admin Client (devhub-backend service account) 는 internal network 의 keycloak:8080 직접 호출.
    # 사용자 (browser) 의 OIDC authorize / token / logout 은 본 path 로 reverse proxy.
    location /devhub/auth/keycloak/ {
        # Keycloak 이 own URL 생성 시 basePath (KC_HTTP_RELATIVE_PATH=/devhub/auth/keycloak) 포함 가정.
        # nginx 는 prefix strip 없이 그대로 forward — trailing slash 제거.
        proxy_pass http://devhub_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Cookie Path Isolation (ADR-0018 §3.4)
        proxy_cookie_path / /devhub/auth/keycloak;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://devhub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
