# /etc/nginx/sites-available/devhub.native.conf
# DevHub Single-Port Ingress — native + host nginx mode (ADR-0018 §3.3).
#
# 본 파일은 backend / frontend / Keycloak 이 host loopback (127.0.0.1:*) 에 native 로
# 가동 중일 때 host 의 nginx 에서 사용한다. compose 운영용은 devhub.deploy.conf.template
# 를 envsubst entrypoint 로 처리한다 (infra/nginx/README.md 참조).
#
# native host nginx 도 HTTP only 로 동작한다. TLS/443 은 사용하지 않는다.

upstream devhub_backend {
    server 127.0.0.1:8080;
}

upstream devhub_keycloak {
    server 127.0.0.1:8180;
}

upstream devhub_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name devhub.example.com;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /devhub;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    location /devhub/api/ {
        rewrite ^/devhub/api/(.*)$ /api/$1 break;
        proxy_pass http://devhub_backend;
        client_max_body_size 10m;
    }

    # `/devhub/swagger/*` 를 backend 의 swagger UI mount 로 전달 (ADR-0027, sprint
    # work_260610-a). default opt-out: backend 가 DEVHUB_SWAGGER_ENABLED=true 일 때만
    # /swagger/* 노출. 본 location 은 backend 에 1:1 rewrite + forward.
    location /devhub/swagger/ {
        rewrite ^/devhub/swagger/(.*)$ /swagger/$1 break;
        proxy_pass http://devhub_backend;
        client_max_body_size 10m;
    }

    location ^~ /devhub/auth/keycloak/admin/ {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://devhub_keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /devhub/auth/keycloak;
    }

    location /devhub/auth/keycloak/ {
        proxy_pass http://devhub_keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /devhub/auth/keycloak;
    }

    location /devhub/ {
        proxy_pass http://devhub_frontend/devhub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /metrics {
        proxy_pass http://devhub_backend/metrics;
    }

    location = / {
        return 301 /devhub/;
    }
}
