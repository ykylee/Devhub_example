# /etc/nginx/sites-available/devhub.conf
# DevHub Single-Port Ingress Configuration (ADR-0018)

upstream devhub_backend {
    server 127.0.0.1:8080;
}

upstream devhub_hydra {
    server 127.0.0.1:4444;
}

upstream devhub_kratos {
    server 127.0.0.1:4433;
}

upstream devhub_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name devhub.example.com;

    # Redirect all HTTP traffic to HTTPS (Security Baseline)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name devhub.example.com;

    # SSL Certificate Configurations (SOP)
    ssl_certificate     /etc/ssl/devhub/fullchain.pem;
    ssl_certificate_key /etc/ssl/devhub/privkey.pem;

    # Strong SSL Security Baseline
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (ADR-0018 §3.4)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' ws: wss:; img-src 'self' data:; font-src 'self' data:;" always;

    # Common Reverse Proxy Headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /devhub;
    
    # Enable WebSocket connections passing X-Request-ID
    proxy_set_header X-Request-ID      $request_id;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # 1. /devhub/api/v1/* -> Backend-Core (Go :8080)
    # Strip '/devhub' prefix and forward to backend '/api/'
    location /devhub/api/ {
        proxy_pass http://devhub_backend/api/;
        
        # Max payload protection (ADR-0015 streaming cap baseline)
        client_max_body_size 10m;
    }

    # 2. /devhub/auth/hydra/* -> Ory Hydra public (Port :4444)
    # Forward the public OAuth2 flows.
    # Note: Kratos/Hydra admin endpoints MUST NOT be exposed here (internal-only).
    location /devhub/auth/hydra/ {
        proxy_pass http://devhub_hydra/;
        
        # Cookie Path Isolation (ADR-0018 §3.4)
        proxy_cookie_path / /devhub/auth/hydra;
    }

    # 3. /devhub/auth/kratos/* -> Ory Kratos public (Port :4433)
    # Forward self-service login/signup/settings endpoints.
    location /devhub/auth/kratos/ {
        proxy_pass http://devhub_kratos/;
        
        # Cookie Path Isolation
        proxy_cookie_path / /devhub/auth/kratos;
    }

    # 4. /devhub/* (Default route) -> Next.js Frontend (Port :3000)
    # Next.js basePath is set to '/devhub', so path is forwarded as-is.
    location /devhub/ {
        proxy_pass http://devhub_frontend/devhub/;
        
        # Upgrade header configurations for dynamic real-time WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 5. Prometheus Scrape endpoint (Admin allowlist example)
    location /metrics {
        # Restrict metrics scrape to allowed monitoring subnet
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://devhub_backend/metrics;
    }

    # Root fallback redirect to frontendBasePath
    location = / {
        return 301 /devhub/;
    }
}
