      summary: "SCM 에 신규 repository 생성"
      operationId: createSCMRepository
      description: |
        provider_id 의 SCM 에 신규 repository 생성 + DevHub draft 자동 등록.
        admin 전용. 본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
          description: "provider ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryDraftRequest"
            example:
              provider_key: "gitea:internal"
              name: "team_payment"
              full_name: "Platform Team/Payment Service"
              visibility: "private"
      responses:
        "201":
          description: "SCM repository 생성 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  repository_id: "repo_002"
                  status: "draft"
                  scm_url: "https://gitea.internal/Platform Team/Payment Service"
                request_id: "req_scm_create_001"
                trace_id: "trace_scm_create_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "409":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

