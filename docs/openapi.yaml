              label: "Jira (Production)"
              config:
                project_key: "DEVHUB"
      responses:
        "200":
          description: "Integration 수정 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
