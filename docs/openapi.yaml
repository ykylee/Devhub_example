        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/rbac/policies — RBAC policy 목록 (P2 batch 2, bearerAuth only)
  # POST /api/v1/rbac/policies — RBAC policy 생성 (P2 batch 2, bearerAuth only)
  # PUT /api/v1/rbac/policies — RBAC policy 일괄 교체 (P2 batch 2, bearerAuth only)
  # ---------------------------------------------------------------------------
  /api/v1/rbac/policies:
    get:
      tags:
        - Audit
      summary: "RBAC policy 목록"
      operationId: listRBACPolicies
      description: |
        RBAC policy role × resource × action 매트릭스 목록.
        admin 전용 read. 본 endpoint 는 admin 영역 — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: "RBAC policy 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - role: "developer"
                      permissions:
                        - resource: "security"
                          action: "view"
                        - resource: "infrastructure"
                          action: "view"
                    - role: "system_admin"
                      permissions:
                        - resource: "organization"
                          action: "delete"
                request_id: "req_rbac_list_001"
                trace_id: "trace_rbac_list_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    post:
      tags:
        - Audit
      summary: "RBAC policy 생성"
      operationId: createRBACPolicy
      description: |
        신규 role + permission 매트릭스 생성. system_admin 전용.
        본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RBACPolicyCreateRequest"
            example:
              role: "team_manager"
              permissions:
                - resource: "organization"
                  action: "edit"
                - resource: "security"
                  action: "create"
      responses:
        "201":
          description: "RBAC policy 생성 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  role: "team_manager"
                  permissions:
                    - resource: "organization"
                      action: "edit"
                request_id: "req_rbac_create_001"
                trace_id: "trace_rbac_create_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "409":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    put:
      tags:
        - Audit
      summary: "RBAC policy 일괄 교체"
      operationId: updateRBACPolicies
      description: |
        RBAC policy 매트릭스 전체 교체 (모든 role 일괄 갱신). system_admin 전용.
        본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RBACPolicyBulkUpdateRequest"
            example:
              policies:
                - role: "developer"
                  permissions:
                    - resource: "security"
                      action: "view"
                - role: "system_admin"
                  permissions:
                    - resource: "organization"
                      action: "delete"
      responses:
        "200":
          description: "RBAC policy 일괄 교체 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  updated_count: 4
                request_id: "req_rbac_put_001"
                trace_id: "trace_rbac_put_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
