  # ---------------------------------------------------------------------------
  # GET /api/v1/dev-request-tokens — DREQ admin token (admin, bearerAuth)
  # POST /api/v1/dev-request-tokens — DREQ intake token 발급 (P3 batch 2, bearerAuth only)
  # PATCH /api/v1/dev-request-tokens/{token_id} — allowed_ips mutation (P3 batch 2, ADR-0017, bearerAuth only)
  # DELETE /api/v1/dev-request-tokens/{token_id} — revoke (P3 batch 2, bearerAuth only, idempotent)
  # ---------------------------------------------------------------------------
  /api/v1/dev-request-tokens:
    get:
      tags:
        - DevRequest
      summary: "DevRequest token 목록 (system_admin)"
      operationId: listDevRequestTokens
      description: |
        발급된 DREQ intake token 목록. system_admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: "Token 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - token_id: "tok_001"
                      label: "intake-cicd-pipeline"
                      status: "active"
                      created_at: "2026-05-01T00:00:00Z"
                      created_by: "admin"
                request_id: "req_dreq_tok_list"
                trace_id: "trace_dreq_tok_list"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    post:
      tags:
        - DevRequest
      summary: "DREQ intake token 발급"
      operationId: createDevRequestIntakeToken
      description: |
        신규 DREQ intake token 발급. plain token 1회 노출 + SHA-256 hashed
        저장. ADR-0014 + ADR-0017 정합. system_admin 전용.
        본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevRequestIntakeTokenCreateRequest"
            example:
              label: "external-intake-2026Q3"
              allowed_ips:
                - "10.0.0.0/8"
              expires_at: "2026-12-31T23:59:59Z"
      responses:
        "201":
          description: "intake token 발급 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  token_id: "tok_001"
                  token: "plain-token-once-only-..."
                  label: "external-intake-2026Q3"
                  expires_at: "2026-12-31T23:59:59Z"
                request_id: "req_dreq_tok_create_001"
                trace_id: "trace_dreq_tok_create_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # PATCH /api/v1/dev-request-tokens/{token_id} — allowed_ips mutation (P3 batch 2, ADR-0017)
  # DELETE /api/v1/dev-request-tokens/{token_id} — revoke (P3 batch 2, idempotent)
  # ---------------------------------------------------------------------------
  /api/v1/dev-request-tokens/{token_id}:
    patch:
      tags:
        - DevRequest
      summary: "DREQ intake token IP mutation"
      operationId: updateDevRequestIntakeTokenIPs
      description: |
        token_id 의 allowed_ips 동적 갱신 (ADR-0017). 운영 IP allowlist
        갱신 시 사용. atomicity 보장 (CTE + FOR UPDATE, ADR-0017 §6 carve 정합).
        system_admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: token_id
          in: path
          required: true
          schema:
            type: string
          description: "수정할 token ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevRequestIntakeTokenUpdateRequest"
            example:
              allowed_ips:
                - "10.0.0.0/8"
                - "192.168.0.0/16"
      responses:
        "200":
          description: "token IP 갱신 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  token_id: "tok_001"
                  allowed_ips:
                    - "10.0.0.0/8"
                    - "192.168.0.0/16"
                request_id: "req_dreq_tok_patch_001"
                trace_id: "trace_dreq_tok_patch_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    delete:
      tags:
        - DevRequest
      summary: "DREQ intake token revoke (idempotent)"
      operationId: revokeDevRequestIntakeToken
      description: |
        token_id 의 intake token revoke. idempotent — revoked_at = COALESCE
        (revoked_at, NOW()) 패턴. 만료/유출 시 호출. system_admin 전용.
        본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: token_id
          in: path
          required: true
          schema:
            type: string
          description: "revoke 할 token ID"
      responses:
        "204":
          description: "token revoke 성공 (idempotent)"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

