  # ---------------------------------------------------------------------------
  /api/v1/audit-logs:
    get:
      tags:
        - Audit
      summary: "Audit log 목록 조회 (admin)"
      operationId: listAuditLogs
      description: |
        시스템 audit log (user action / admin action / security event). admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: actor
          in: query
          required: false
          schema:
            type: string
          description: "행위자 ID 필터"
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: "Action 타입 필터 (create / update / delete / login / logout)"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "시작 시각"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "종료 시각"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: "최대 조회 개수"
      responses:
        "200":
          description: "Audit log 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - log_id: "audit_001"
                      timestamp: "2026-06-09T10:00:00Z"
                      actor: "alice"
                      action: "update"
                      resource: "platform:plat_001"
                      details:
                        field: "description"
                        old_value: "old desc"
                        new_value: "new desc"
                request_id: "req_audit_list"
                trace_id: "trace_audit_list"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/commands/{command_id} — command 상태 조회 (admin, bearerAuth)
  # ---------------------------------------------------------------------------
  /api/v1/commands/{command_id}:
    get:
      tags:
        - RiskCommand
      summary: "Command 상태 조회"
      operationId: getCommandById
      description: |
        비동기 command (mitigation / approval) 상태 조회. admin 전용 read.
        ADR-0029: staticTokenAuth 허용 (infrastructure:view).
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: command_id
          in: path
          required: true
          schema:
            type: string
          description: "Command ID"
      responses:
        "200":
          description: "Command 상태"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  command_id: "cmd_001"
                  type: "risk_mitigation"
                  status: "executing"
                  progress_pct: 65
                  started_at: "2026-06-09T10:00:00Z"
                request_id: "req_cmd_get"
                trace_id: "trace_cmd_get"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/admin/service-actions — admin service action (P3 batch 1, bearerAuth only)
  # ---------------------------------------------------------------------------
  /api/v1/admin/service-actions:
    post:
      tags:
        - Audit
      summary: "Service action 생성 (admin)"
      operationId: createServiceAction
      description: |
        신규 service action (deployment / restart / scale) 생성.
        system_admin 전용. 본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - action_type
                - reason
              properties:
                service_id:
                  type: string
                  description: "대상 service 의 DevHub ID (handler 가 400 if empty)"
                action_type:
                  type: string
                  enum:
                    - "deploy"
                    - "restart"
                    - "scale"
                    - "rollback"
                reason:
                  type: string
                  description: "action 사유 (audit, handler 가 400 if empty)"
                force:
                  type: boolean
                dry_run:
                  type: boolean
                idempotency_key:
                  type: string
                metadata:
                  type: object
            example:
              service_id: "service_payments"
              action_type: "restart"
              reason: "memory leak triage — pod restart"
      responses:
        "202":
          description: "Service action 접수 (async 실행)"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  action_id: "act_001"
                  status: "pending"
                request_id: "req_svc_action_001"
                trace_id: "trace_svc_action_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/admin/users/{user_id}/review — admin 의 onboarding review confirm (P3 batch 1, bearerAuth only, RM-ONBOARD-01)
    # API Key Admin (ADR-0029 §6 (f) P3) — system_admin only. raw key 1회만
  # 응답 (POST), list/PATCH/DELETE 는 key_prefix 만 노출.
  # 자세한 spec: [`docs/planning/api-key-management-sprint-plan.md` §3.3].
  # ---------------------------------------------------------------------------
  /api/v1/admin/api-keys:
    post:
      tags:
        - Auth
      summary: "신규 API key 발급 — raw key 1회 응답"
      operationId: createApiKey
      description: |
        system_admin 일임 (routePermissionTable 정합). server-side 가 32 byte
        crypto/rand 로 raw key 생성 후 sha256 hash 만 DB 저장. 응답의 `key`
        field 는 **1회만** 노출 — frontend 가 modal 에서 clipboard copy 후
        폐기해야. 이후 GET 은 key_prefix 만 노출 (보안 invariant).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      responses:
        "201":
          description: "발급 성공. raw key 1회 노출."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          description: "API key store 미설정 (DEVHUB_API_KEY_STORE_PG unset)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeError"
    get:
      tags:
        - Auth
      summary: "API key 목록 조회 (key_prefix 만, raw key 미포함)"
      operationId: listApiKeys
      description: |
        모든 활성/회수/만료 키의 metadata 조회. raw key 는 절대 노출 안 됨
        (key_hash 도 미포함). system_admin 일임.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "목록 조회 성공"
          content:
            application/json:
              schema:
                type: object
                required: [api_keys, count]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeySummary"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailableEnvelope"
  /api/v1/admin/api-keys/{api_key_id}:
    patch:
      tags:
        - Auth
      summary: "API key metadata 갱신 (expires_at / allowed_cidrs)"
      operationId: updateApiKeyMeta
      description: |
        name 은 변경 불가 (의도적). expires_at 와 allowed_cidrs 만 갱신.
        revoked key 는 update 불가 (404). system_admin 일임.
      security:
        - bearerAuth: []
      parameters:
        - name: api_key_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdateRequest"
      responses:
        "200":
          description: "갱신 성공"
          content:
            application/json:
              schema:
                type: object
                required: [status, api_key_id]
                properties:
                  status:
                    type: string
                    enum: [updated]
                  api_key_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailableEnvelope"
    delete:
      tags:
        - Auth
      summary: "API key 회수 (idempotent)"
      operationId: revokeApiKey
      description: |
        ADR-0029 §6 (f) P3. 이미 회수된 key 도 audit 만 갱신 (idempotent).
        회수 후 auth middleware 가 401 reject.
      security:
        - bearerAuth: []
      parameters:
        - name: api_key_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "회수 성공 (또는 이미 회수됨 — idempotent)"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailableEnvelope"

# ---------------------------------------------------------------------------
  /api/v1/admin/users/{user_id}/review:
    post:
      tags:
        - Me
      summary: "User onboarding review confirm (admin)"
      operationId: confirmUserReview
      description: |
