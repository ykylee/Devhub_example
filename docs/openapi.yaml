        - DevRequest
      summary: "DevRequest 접수 (intake token)"
      operationId: createDevRequest
      description: |
        외부/내부 개발 요청 접수. X-Intake-Token header 로 검증.
        Bearer token 불필요 — intake 전용.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: X-Intake-Token
          in: header
          required: true
          schema:
            type: string
          description: "DREQ intake token — 사전 발급된 요청 key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: "요청 제목"
                description:
                  type: string
                  description: "요청 상세"
                priority:
                  type: string
                  description: "우선순위 (P0 / P1 / P2 / P3)"
                requester_contact:
                  type: string
                  description: "요청자 연락처 (email / slack)"
              required:
                - title
              example:
