                trace_id: "trace_user_update_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    delete:
      tags:
        - Me
      summary: "사용자 삭제 (soft delete)"
      operationId: deleteUser
      description: |
        user_id 의 DevHub row soft delete. Keycloak 계정은
        별도 admin console 에서 처리. ADR-0020 §3.3 정합.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: "삭제할 사용자 ID"
      responses:
        "204":
          description: "user 삭제 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

