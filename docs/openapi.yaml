          schema:
            type: string
          description: "조회할 사용자 ID"
      responses:
        "200":
          description: "사용자 profile"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  user_id: "bob"
                  email: "bob@example.com"
                  display_name: "Bob Lee"
                  role: "manager"
                  status: "active"
                  idp_subject: "x9y8z7w6-..."
                request_id: "req_user_001"
                trace_id: "trace_user_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    patch:
      tags:
        - Me
      summary: "사용자 정보 수정"
      operationId: updateUser
      description: |
        user_id 의 display_name / role / primary_unit_id / status 수정.
        admin 전용. role mutation 은 ADR-0026 + ADR-0020 §3.3 정합.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: "수정할 사용자 ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
            example:
              display_name: "Charlie Park (Updated)"
              primary_unit_id: "unit_api"
      responses:
        "200":
          description: "user 수정 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
