        - Me
      summary: "사용자 정보 조회"
      operationId: getUserById
      description: |
        user_id 로 사용자 profile 조회. admin / manager 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
