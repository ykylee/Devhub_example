            - "developer"
            - "team_manager"
            - "org_head"
            - "system_admin"
          description: "DevHub 내부 role (ADR-0026 + ADR-0011). handler 가 validAppRoles 검증."
        status:
          type: string
          enum:
            - "active"
            - "pending"
            - "deactivated"
          description: "계정 상태 (handler 가 validUserStatuses 검증, 400 if empty)"
        primary_unit_id:
          type: string
          description: "소속 조직 unit (HR sync 시 자동 매핑 가능)"
          example: "unit_platform"

    # -----------------------------------------------------------------------
    # UserUpdateRequest — PATCH /api/v1/users/{user_id} request body
    # -----------------------------------------------------------------------
    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "charlie+new@example.com"
        display_name:
          type: string
          example: "Charlie Park (Updated)"
        role:
          type: string
          enum:
            - "developer"
            - "team_manager"
            - "org_head"
            - "system_admin"
          description: "role mutation — ADR-0026 정합 (DB rbac_policies 가 SoT)"
        primary_unit_id:
          type: string
          example: "unit_api"
        status:
          $ref: "#/components/schemas/AccountStatus"

    # -----------------------------------------------------------------------
    # RiskMitigationRequest — POST /api/v1/risks/{risk_id}/mitigations request body
    # -----------------------------------------------------------------------
    RiskMitigationRequest:
      type: object
      required:
        - action_type
        - reason
      properties:
        action_type:
          type: string
          description: "완화 조치 action type (handler `commands.go:riskMitigationRequest` 의 `action_type` 필드, 400 if empty)"
          example: "deploy_secondary_keycloak"
        reason:
          type: string
          description: "조치 사유 (handler 가 400 if empty)"
          example: "단일 keycloak instance SPOF 회피"
        target_date:
          type: string
          format: date
          description: "완화 목표일"
          example: "2026-07-15"
        dry_run:
          type: boolean
        idempotency_key:
          type: string
        metadata:
          type: object

    # -----------------------------------------------------------------------
    # RiskMitigation — POST /api/v1/risks/{risk_id}/mitigations 응답 data
    # -----------------------------------------------------------------------
    RiskMitigation:
      type: object
      required:
        - id
        - risk_id
        - action
        - owner
        - status
      properties:
        id:
          type: string
          example: "mit_001"
        risk_id:
          type: string
          example: "risk_001"
        action:
          type: string
          example: "deploy secondary keycloak instance"
        owner:
          type: string
          example: "alice"
        target_date:
          type: string
          format: date
          example: "2026-07-15"
        status:
          type: string
          enum:
            - "pending"
            - "in_progress"
            - "completed"
            - "cancelled"
          example: "pending"
        created_at:
          type: string
          format: date-time
          example: "2026-06-09T12:00:00Z"

    # -----------------------------------------------------------------------
    # CommandDecisionRequest — POST /commands/{id}/approve|reject request body
    # -----------------------------------------------------------------------
    CommandDecisionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: "결정 사유 (handler `commands.go:reviewCommand` 가 400 if empty, audit note 로 보존)"
          example: "approved after risk review"

    # -----------------------------------------------------------------------
    # OrgUnitCreateRequest — POST /api/v1/organization/units (ADR-0029 §6 (c) P2 batch 2)
    # -----------------------------------------------------------------------
    OrgUnitCreateRequest:
      type: object
      required:
        - unit_id
        - label
        - unit_type
        - parent_unit_id
      properties:
        unit_id:
          type: string
          description: "org unit 고유 ID (handler `createOrgUnitRequest` 가 400 if empty)"
          example: "unit_api"
        label:
          type: string
          description: "org unit 표시 이름 (handler 가 400 if empty)"
          example: "API Team"
        unit_type:
          type: string
          description: "org unit type (handler 가 validOrgUnitTypes 검증)"
          example: "team"
        parent_unit_id:
          type: string
          description: "상위 org unit ID (트리 구조)"
          example: "unit_platform"
        leader_user_id:
          type: string
          description: "unit leader user_id"
          example: "alice"
        position_x:
          type: integer
          description: "org chart 의 x 좌표"
        position_y:
          type: integer
          description: "org chart 의 y 좌표"

    # -----------------------------------------------------------------------
    # OrgUnitUpdateRequest — PATCH /api/v1/organization/units/{id}
    # -----------------------------------------------------------------------
    OrgUnitUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "API Team (Renamed)"
        description:
          type: string

    # -----------------------------------------------------------------------
    # OrgUnitMemberReplaceRequest — PUT /api/v1/organization/units/{id}/members
    # -----------------------------------------------------------------------
    OrgUnitMemberReplaceRequest:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          description: "unit member 의 user_id flat array (handler `replaceUnitMembersRequest` 가 trim + dedup, 빈 입력 시 empty 로 교체)"
          items:
            type: string
            example: "alice"
          example:
            - "alice"
            - "bob"

    # -----------------------------------------------------------------------
    # OrganizationHierarchyRequest — PUT /api/v1/organization/hierarchy
    # -----------------------------------------------------------------------
    OrganizationHierarchyRequest:
      type: object
      required:
        - organization_id
        - units
      properties:
        organization_id:
          type: string
          example: "org_devhub"
        name:
          type: string
          example: "DevHub"
        units:
          type: array
          items:
            type: object
            properties:
              unit_id:
                type: string
                example: "unit_platform"
              name:
                type: string
                example: "Platform Team"
              teams:
                type: array
                items:
                  type: object
                  properties:
                    team_id:
                      type: string
                    name:
                      type: string

    # -----------------------------------------------------------------------
    # RBACPolicyCreateRequest — POST /api/v1/rbac/policies
    # -----------------------------------------------------------------------
    RBACPolicyCreateRequest:
      type: object
      required:
        - id
        - name
        - permissions
      properties:
        id:
          type: string
          description: "role ID (handler `rbacCreateRoleRequest.id` 가 400 if empty)"
          example: "custom_role_001"
        name:
          type: string
          description: "role 표시 이름 (handler 가 400 if empty)"
          example: "Custom Security Reviewer"
        description:
          type: string
          description: "role 설명"
        permissions:
          type: object
          description: "PermissionMatrix — resource key 별 {view, create, edit, delete} boolean 객체 (handler `rbacCreateRoleRequest.Permissions` 가 직접 unmarshal). array 아님."
          additionalProperties:
            type: object
            properties:
              view:
                type: boolean
              create:
                type: boolean
              edit:
                type: boolean
              delete:
                type: boolean
          example:
            security:
              view: true
              create: false
              edit: false
              delete: false
            repositories:
              view: true
              create: true
              edit: true
              delete: false

    # -----------------------------------------------------------------------
    # RBACPolicyBulkUpdateRequest — PUT /api/v1/rbac/policies
    # -----------------------------------------------------------------------
    RBACPolicyBulkUpdateRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          description: "bulk update 할 role array (handler `rbacUpdatePoliciesRequest.Roles`, 400 if empty)"
          items:
            $ref: "#/components/schemas/RBACPolicyCreateRequest"

    # -----------------------------------------------------------------------
    # RepositoryDraftRequest — POST/PATCH /api/v1/repositories (ADR-0029 §6 (c) P3 batch 2)
    # -----------------------------------------------------------------------
    RepositoryDraftRequest:
      type: object
      required:
        - key
        - slug
        - provider_key
      properties:
        key:
          type: string
          description: "Repository 단축 식별자 (URL 친화, 고유)"
          example: "team_api"
        slug:
          type: string
          description: "Repository slug (소문자 + 하이픈, SCM 등록용)"
          example: "team-api"
        provider_key:
          type: string
          description: "provider 식별자 (예: gitea:internal, github:devhub). 빈 값이면 provider 미지정 draft."
          example: "gitea:internal"

    # -----------------------------------------------------------------------
    # RepositoryPublishRequest — POST /api/v1/repositories/{id}/publish
    # -----------------------------------------------------------------------
    RepositoryPublishRequest:
      type: object
      properties:
        note:
          type: string
          description: "Publish 사유 (audit note)"
          example: "ready to publish — initial commit pushed"

    # -----------------------------------------------------------------------
    # DevRequestIntakeTokenCreateRequest — POST /api/v1/dev-request-tokens (ADR-0014 + ADR-0017)
    # -----------------------------------------------------------------------
    DevRequestIntakeTokenCreateRequest:
      type: object
      required:
        - client_label
        - source_system
      properties:
        client_label:
          type: string
          description: "intake token label (운영 식별용, 클라이언트 표기)"
          example: "external-intake-2026Q3"
        source_system:
          type: string
          description: "intake 발급 출처 시스템 (ex. jira, slack, console)"
          example: "jira"
        allowed_ips:
          type: array
          items:
            type: string
          description: "허용 IP CIDR (없으면 all)"
          example:
            - "10.0.0.0/8"
        expires_at:
          type: string
          format: date-time
          description: "만료 일시 (없으면 무기한)"
          example: "2026-12-31T23:59:59Z"

    # -----------------------------------------------------------------------
    # DevRequestIntakeTokenUpdateRequest — PATCH /api/v1/dev-request-tokens/{id} (ADR-0017 §6)
    # -----------------------------------------------------------------------
    DevRequestIntakeTokenUpdateRequest:
      type: object
      properties:
        allowed_ips:
          type: array
          items:
            type: string
          description: "허용 IP CIDR (빈 배열 = all)"
          example:
            - "10.0.0.0/8"
            - "192.168.0.0/16"

  # =========================================================================
    # API Key (ADR-0029 §6 (f) P3) — multi-key 관리 schema
    # sprint: feat/work_260609-k-api-key-management
    # raw key 는 ApiKeyCreateResponse.key 에 1회만 노출 — 이후 GET 은 절대 안 됨
    # -----------------------------------------------------------------------
    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: "운영자 식별용 이름 (revoke/create 후 재사용 가능)"
          example: "ci-runner-prod"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: "만료 시각 (RFC3339). null = 무기한. 미래 시각만 허용."
          example: "2027-01-01T00:00:00Z"
        allowed_cidrs:
          type: array
          items:
            type: string
          description: |
            CIDR allowlist. null/empty = all IPs 허용. auth middleware 가
            ClientIP 와 CIDR match 검증. invalid CIDR 면 400.
          example: ["10.0.0.0/8", "192.168.0.0/16"]

    ApiKeyCreateResponse:
      type: object
      required: [api_key, key, warning]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKeySummary"
        key:
          type: string
          description: |
            **raw API key — 1회만 응답.** `dhk_` prefix + base64url(32 byte) =
            47 자. frontend 가 modal 에서 clipboard copy 후 폐기. 서버는 hash
            만 보관하므로 이후 GET 으로 재조회 불가.
          example: "dhk_3J7xRt0...총47자..."
        key_expires_at:
          type: string
          format: date-time
          nullable: true
          description: "만료 시각 (request 의 expires_at 와 동일)"
        warning:
          type: string
          description: "보안 경고 문구 (한국어/영어)"
          example: "이 키는 다시 볼 수 없습니다. 안전한 곳에 즉시 저장하세요."

    ApiKeySummary:
      type: object
      required: [id, name, key_prefix, created_by, created_at, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: |
            raw key 의 앞 8자 (예: `dhk_3J7x`). 운영자 식별/audit 용. raw
            key 복원에 사용 불가 (sha256 1-way).
        created_by:
          type: string
          description: "발급한 actor login"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_by:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        allowed_cidrs:
          type: array
          items:
            type: string
          nullable: true
        status:
          type: string
          enum: [active, revoked, expired]
          description: |
            `revoked_at IS NULL AND (expires_at IS NULL OR expires_at > now())`
            의 derived status. DB 컬럼이 아닌 view-time 계산.

    ApiKeyUpdateRequest:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: "갱신할 만료 시각. null = clear (무기한). 미래 시각만 허용."
        allowed_cidrs:
          type: array
          items:
            type: string
          nullable: true
          description: "갱신할 CIDR allowlist. empty array = clear (all IPs)."

  # Security Schemes
  # =========================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Keycloak-issued access token (ADR-0019)"

    staticTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: Static
      description: |
        DEVHUB_API_KEY 정적 키. Keycloak-independent 인증.
        공개 read-only API 조회용. admin endpoints 는 bearerAuth 강제.
        ADR-0029.

  # =========================================================================
  # Parameters
  # =========================================================================
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      description: |
        Correlation ID. caller-supplied 시 passthrough, 미설정 시 서버 자동 생성.
        response header 로 echo.
      schema:
        type: string
        example: "req_caller_supplied_42"
      required: false

  # =========================================================================
  # Headers
  # =========================================================================
  headers:
    XRequestID:
      description: "Correlation ID — 요청과 동일한 값 또는 서버 생성"
      schema:
        type: string
        example: "req_caller_supplied_42"

    XKeycloakLikelyDown:
      description: |
        N-8 hotfix 4차 marker. Keycloak network/5xx outage 시 "true".
        frontend 가 이 marker 확인 시 OIDC end_session_endpoint 호출 skip + 강제 /login redirect.
        config_error (ErrOIDCConfigMissing) 시에는 미부착.
      schema:
        type: string
        example: "true"

    XLogoutHotfix:
      description: "N-8 hotfix version identifier — marker 와 함께 부착"
      schema:
        type: string
        example: "N-8-4:graceful-degrade"

  # =========================================================================
  # 공통 Error Responses
  # =========================================================================
  responses:
    UnauthorizedEnvelope:
      description: "인증 실패 — Bearer token 없음 또는 검증 실패"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
          example:
            schema_version: "1.0"
            data: null
            request_id: "req_unauth_001"
            trace_id: "trace_unauth_001"
            error:
              code: "unauthenticated"
              message: "invalid bearer token"

    ForbiddenEnvelope:
      description: "권한 부족 — role/permission deny"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
          example:
            schema_version: "1.0"
            data: null
            request_id: "req_forbidden_001"
            trace_id: "trace_forbidden_001"
            error:
              code: "auth_row_denied"
              message: "insufficient role for this resource"

    BadRequestEnvelope:
      description: "잘못된 요청"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
          example:
            schema_version: "1.0"
            data: null
            request_id: "req_bad_001"
            trace_id: "trace_bad_001"
            error:
              code: "validation_failed"
              message: "request payload validation failed"
              details: "field 'email' is required"

    ServerErrorEnvelope:
      description: "서버 내부 오류 — 5xx"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
          example:
            schema_version: "1.0"
            data: null
            request_id: "req_server_err_001"
            trace_id: "trace_server_err_001"
            error:
              code: "internal_error"
              message: "unexpected server error"
