  # ---------------------------------------------------------------------------
  # PATCH /api/v1/integration/bindings/{binding_id} — binding 수정 (P3 batch 3, bearerAuth only)
  # DELETE /api/v1/integration/bindings/{binding_id} — binding 삭제 (P3 batch 3, bearerAuth only)
  # ---------------------------------------------------------------------------
  /api/v1/integration/bindings/{binding_id}:
    patch:
      tags:
        - Integration
      summary: "Integration binding 수정"
      operationId: updateIntegrationBinding
      description: |
        binding_id 의 binding (integration ↔ org/repo link) 수정.
        admin 전용. 본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: binding_id
          in: path
          required: true
          schema:
            type: string
          description: "수정할 binding ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  description: "binding-specific config (JSON)"
                enabled:
                  type: boolean
                  description: "binding 활성/비활성"
            example:
              config:
                channel: "#devhub-alerts"
              enabled: true
      responses:
        "200":
          description: "Binding 수정 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  binding_id: "bind_001"
                  enabled: true
                request_id: "req_bind_update_001"
                trace_id: "trace_bind_update_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    delete:
      tags:
        - Integration
      summary: "Integration binding 삭제"
      operationId: deleteIntegrationBinding
      description: |
        binding_id 의 binding 삭제 (cascade: 관련 audit log 보존). admin 전용.
        본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: binding_id
          in: path
          required: true
          schema:
            type: string
          description: "삭제할 binding ID"
      responses:
        "204":
          description: "Binding 삭제 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/integrations/gitea/webhooks — Gitea webhook (no auth)
  # ---------------------------------------------------------------------------
  /api/v1/integrations/gitea/webhooks:
    post:
      tags:
        - Integration
      summary: "Gitea webhook 수신"
      operationId: postGiteaWebhook
      description: |
        Gitea 가 전송하는 push / pull_request webhook 수신.
        X-Webhook-Secret header 로 서명 검증. Bearer token 불필요.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: X-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
          description: "Gitea webhook secret"
        - name: X-Gitea-Event
          in: header
          required: true
          schema:
            type: string
          description: "Gitea event type (push / pull_request / issues)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                repository:
                  type: object
                commits:
                  type: array
                  items:
                    type: object
              example:
                ref: "refs/heads/main"
                repository:
                  full_name: "org/devhub-core"
                  html_url: "https://gitea.example.com/org/devhub-core"
                commits:
                  - id: "abc123def456"
                    message: "fix: resolve NPE"
                    author:
                      name: "alice"
                      email: "alice@example.com"
      responses:
        "200":
          description: "Webhook 수신 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  status: "accepted"
                  event_id: "evt_gitea_001"
                request_id: "req_gitea_wb_001"
                trace_id: "trace_gitea_wb_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

