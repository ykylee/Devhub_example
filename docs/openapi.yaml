        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/dev-requests/{dev_request_id}/register — Promote (P3 batch 2, bearerAuth only)
  # ---------------------------------------------------------------------------
  /api/v1/dev-requests/{dev_request_id}/register:
    post:
      tags:
        - DevRequest
      summary: "DevRequest Promote (Application/Project 생성)"
      operationId: registerDevRequest
      description: |
        dev_request_id 의 DREQ 를 Application 또는 Project 로 promote
        (단일 트랜잭션 — sprint `claude/work_260515-m` PR #128).
        admin 전용. 본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: dev_request_id
          in: path
          required: true
          schema:
            type: string
          description: "Promote 할 DREQ ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_type
              properties:
                target_type:
                  type: string
                  enum:
                    - "platform"
                    - "project"
                  description: "promote 대상 타입. `platform` 또는 `project`."
                target_id:
                  type: string
                  description: "기존 platform/project ID (재할당 시). application_payload/project_payload 와 mutual-exclusion."
                application_payload:
                  type: object
                  description: "신규 platform 생성 payload (target_type=platform 일 때 사용). target_id 와 mutual-exclusion."
                  properties:
                    key:
                      type: string
                      description: "platform key (URL 친화, 고유)"
                    name:
                      type: string
                      description: "platform 표시 이름"
                    description:
                      type: string
                    owner_user_id:
                      type: string
                project_payload:
                  type: object
                  description: "신규 project 생성 payload (target_type=project 일 때 사용). target_id 와 mutual-exclusion."
                  properties:
                    repository_id:
                      type: integer
                      format: int64
                      description: "project 가 속할 repository 의 FK"
                    key:
                      type: string
                    name:
                      type: string
            example:
              target_type: "platform"
              application_payload:
                key: "api_service"
                name: "API Service"
                description: "Backend API service"
                owner_user_id: "user_001"
      responses:
        "201":
          description: "Promote 성공 (application/project 생성)"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  target_id: "app_001"
                  target_type: "application"
                  dev_request_id: "dreq_001"
                request_id: "req_dreq_register_001"
                trace_id: "trace_dreq_register_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "409":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

