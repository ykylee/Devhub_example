          schema:
            type: string
          description: "삭제할 role ID (예: developer, team_manager, system_admin)"
      responses:
        "204":
          description: "RBAC policy 삭제 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "409":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/realtime/ws — WebSocket upgrade (P3 batch 1, ADR-0024 Bypass)
  # ---------------------------------------------------------------------------
  /api/v1/realtime/ws:
    get:
      tags:
        - Realtime
      summary: "WebSocket connection upgrade"
      operationId: getRealtimeWebsocket
      description: |
        WebSocket protocol upgrade. ADR-0024 ticket pattern — 클라이언트는
        POST /api/v1/realtime/ticket 으로 60s single-use ticket 발급 후 본
        endpoint 에 ticket query param 으로 연결. 인증된 actor 면 누구나
        (Bypass, RBAC matrix lookup 없음).
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: ticket
          in: query
          required: true
          schema:
            type: string
          description: "POST /api/v1/realtime/ticket 으로 발급된 single-use ticket"
      responses:
        "101":
          description: "WebSocket switching protocols"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

