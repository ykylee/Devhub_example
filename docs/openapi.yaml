  # ---------------------------------------------------------------------------
  /api/v1/integration/providers/{provider_id}/scm-repositories:
    get:
      tags:
        - Integration
      summary: "Provider 의 SCM repository 목록"
      operationId: listSCMRepositories
      description: |
        provider_id 의 SCM (Gitea / GitHub / GitLab) repository 목록 조회.
        ADR-0029: staticTokenAuth 허용 (infrastructure:view).
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
          description: "provider ID"
        - name: org
          in: query
          required: false
          schema:
            type: string
          description: "SCM org/team 필터"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: "SCM repository 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - name: "team_api"
                      full_name: "Platform Team/API Service"
                      visibility: "private"
                      default_branch: "main"
                request_id: "req_scm_repo_list_001"
                trace_id: "trace_scm_repo_list_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/integration/providers/{provider_id}/import-repositories — import from SCM (P3 batch 3, bearerAuth only)
  # ---------------------------------------------------------------------------
  /api/v1/integration/providers/{provider_id}/import-repositories:
    post:
      tags:
        - Integration
      summary: "SCM repository 일괄 import"
      operationId: importSCMRepositories
      description: |
        provider_id 의 SCM repository 일괄 import (bulk). draft status 로
        생성 — publish API 호출까지 application 에 노출 안 됨.
        admin 전용. 본 endpoint 는 write — ADR-0029 staticTokenAuth 미허용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
          description: "provider ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repositories
              properties:
                repositories:
                  type: array
                  items:
                    type: object
                    required:
                      - full_name
                    properties:
                      full_name:
                        type: string
                        example: "Platform Team/API Service"
                      visibility:
                        type: string
                        enum:
                          - "public"
                          - "private"
                          - "internal"
            example:
              repositories:
                - full_name: "Platform Team/API Service"
                  visibility: "private"
                - full_name: "Platform Team/Auth Service"
                  visibility: "private"
      responses:
        "202":
          description: "Import 접수 (bulk 처리)"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  imported_count: 2
                  draft_ids:
                    - "repo_001"
                    - "repo_002"
                request_id: "req_scm_import_001"
                trace_id: "trace_scm_import_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

