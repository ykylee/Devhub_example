      summary: "Repository 등록 (admin)"
      operationId: createRepository
      description: |
        새 repository 등록 (platform 독립 가능). admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Repository 이름"
                repo_key:
                  type: string
                  description: "SCM repo key (예: owner/repo)"
                language:
                  type: string
                  description: "주 언어"
                scm_provider:
                  type: string
                  description: "SCM provider (gitea / github / gitlab)"
                default_branch:
                  type: string
                  description: "Default branch"
                platform_id:
                  type: string
