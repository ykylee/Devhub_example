# =============================================================================
# P1 — Organization (staticTokenAuth OR bearerAuth)
# =============================================================================

  # INVARIANT: /api/v1/organization/hierarchy 는 본 section (P1) 에서 별도 path
  # item 으로 정의하지 않음 — OpenAPI spec 의 unique path key 요구 + P2 batch 2
  # 의 PUT 추가 와의 정합을 위해 §"P2 batch 2 — Organization hierarchy PUT"
  # section 의 path item 하나에 GET+PUT 동시 정의 (PR #520 §6 (c) P1 P2 batch 2).
  # 본 marker 만 유지.

  # ---------------------------------------------------------------------------
  # POST /api/v1/infra/services/snapshot — infra services 일괄 스냅샷 (P3 batch 1, system internal)
  # ---------------------------------------------------------------------------
  /api/v1/infra/services/snapshot:
    post:
      tags:
        - Infra
      summary: "Infra services 일괄 스냅샷"
      operationId: ingestInfraServicesSnapshot
      description: |
        infra services 의 일괄 스냅샷 (cron / probe agent push). Bypass —
        `Authorization: Bearer <InfraAgentToken>` 으로 인증 (handler `infra_integrations.go:78`
        의 `Bearer ` prefix 분기, RBAC matrix 미사용). system / webhook source.
        ADR-0029 staticTokenAuth 도 미허용 (internal only).
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: "`Bearer <InfraAgentToken>` (DEVHUB_INFRA_AGENT_TOKEN)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      service_id:
                        type: string
                      status:
                        type: string
                        enum: ["healthy", "degraded", "down"]
                      observed_at:
                        type: string
                        format: date-time
            example:
              services:
                - service_id: "service_payments"
                  status: "healthy"
                  observed_at: "2026-06-09T12:00:00Z"
                - service_id: "service_auth"
                  status: "degraded"
                  observed_at: "2026-06-09T12:00:00Z"
      responses:
        "202":
          description: "스냅샷 접수 (async 처리)"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

