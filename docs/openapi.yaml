openapi: "3.0.3"
info:
  title: "DevHub API"
  version: "0.6.0-p3-batch3"
  description: |
    DevHub v1.0 출시 직전 swagger scope 확장:
    - 1차 (PR #518, ADR-0029): 4 paths → 50 paths (P0/P1), API key 인증
      미들웨어 + openapi 1차 bootstrap. schema 7 → 59.
    - 2차 (PR #519, ADR-0029 §6 (c) P1 P2 batch 1): + 7 paths
      (user CRUD 4 + risks/critical 1 + risks/{id}/mitigations 1
      + commands/{id}/{approve,reject} 2) + commands/{id} GET 의
      staticTokenAuth 허용. path 50 → 57, schema 59 → 64.
    - 3차 (PR #520, ADR-0029 §6 (c) P1 P2 batch 2): + 11 endpoint
      (organization units CRUD 4 + /units/{id}/members 2 + hierarchy
      PUT 1 + rbac/policies 4) + rbac/policy legacy 410. path 57 → 62,
      schema 64 → 70.
    - 4차 (PR #521, ADR-0029 §6 (c) P1 P3 batch 1): + 5 endpoint
      (admin/service-actions POST 1 + admin/users/{id}/review POST 1
      + infra/services/snapshot POST 1 + infra/topology/v2 GET 1
      + realtime/ws GET 1). path 62 → 67.
    - 5차 (PR #522, ADR-0029 §6 (c) P1 P3 batch 2): + 8 endpoint
      (repositories CRUD 4 + dev-requests/{id}/{register,reject} 2
      + dev-request-tokens sub-path 2) + 4 schema. path 67 → 71,
      schema 70 → 74.
    - 6차 (본 PR, ADR-0029 §6 (c) P1 P3 batch 3): + 11 endpoint
      (integration/providers/{id}/scm-repositories GET 1
      + /import-repositories POST 1 + /create-repository POST 1
      + /webhook POST 1 + /tasks/webhook POST 1
      + integrations/{id} PATCH/DELETE 2
      + integration/bindings/{id} PATCH/DELETE 2
      + repositories/{id}/projects GET/POST 2 = 11 endpoint, 8 path 상위).
      신규 schema 0 (요청 shape inline, RepositoryDraftRequest 재사용).
      path 71 → 79, schema 74 → 74 (변경 0).
    - **§6 (c) → done**: 1차 50 path → 6차 PR 후 79 path, schema 59 → 74.
      router 81 endpoint 중 79 spec 흡수 (잔여 2 endpoint: PATCH/DELETE
      /api/v1/projects/{project_id}/repositories/{repository_id} 는 §6
      범위 외 → ADR-0011 §4.1 의 project-repo 가중치 mutation 으로 별도
      PR 후보).

    ## Envelope 규약
    - 성공: `{schema_version, data, request_id, trace_id}`
    - 실패: `{schema_version, data: null, request_id, trace_id, error: {code, message, details?}}`
    - `/health` 는 envelope 미사용 (raw 200).

    ## 인증
    - Bearer token (Keycloak OIDC access token, ADR-0019).
    - `/me`, `/api/v1/auth/logout` 만 `security: [{bearerAuth}]` 적용.

    ## 참고 — swagger self-link
    본 파일은 `docs/openapi.yaml` 로 직접 hand-maintain.
    Swagger UI 에서 self-link 로 표시할 경우 `/docs/openapi.yaml` 참조.

servers:
  - url: "http://localhost:8080"
    description: "local dev"

tags:
  - name: System
    description: "서비스 상태 확인 — 인증 불필요."
  - name: Auth
    description: "OIDC 기반 로그아웃 — Bearer token 필요."
  - name: Me
    description: "현재 인증된 사용자 profile 조회 — Bearer token 필요."
  - name: Operational
    description: "Prometheus 메트릭 노출 및 운영 endpoint."
  - name: Platform
    description: "Application platform 관리 (API-43..50)."
  - name: Project
    description: "Project 관리 (API-55..56)."
  - name: Repository
    description: "Repository 관리 + 운영 지표 (API-15..23, API-51..54)."
  - name: Integration
    description: "Integration provider + binding + SCM (API-58, API-69..90)."
  - name: RiskCommand
    description: "Risk mitigation + command approval (API-39..43, API-31..32)."
  - name: CI
    description: "CI run + log (API-28..30)."
  - name: DevRequest
    description: "DREQ intake + 조회 + admin token (API-59..68, API-79)."
  - name: Infra
    description: "Infra topology / nodes / edges / services (API-9..14, API-76..78)."
  - name: Organization
    description: "Organization hierarchy + units (API-49..56)."
  - name: Audit
    description: "Audit log + webhook events."
  - name: SCM
    description: "SCM provider catalog (API-41..42)."
  - name: HR
    description: "HR DB lookup."
  - name: Realtime
    description: "WebSocket ticket (ADR-0024)."
  - name: ExternalTask
    description: "External task item (API-94..96)."

paths:
  # ---------------------------------------------------------------------------
  # Health — no envelope, raw JSON
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags:
        - System
      summary: "Go Core 상태 확인"
      operationId: getHealth
      description: |
        backend-core health check. envelope 미사용 — raw JSON 응답.
        DB 연결이 없으면 db=disabled, 연결 불량이면 503.
      responses:
    NotFoundEnvelope:
      description: "리소스 없음 — 404"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
          example:
            schema_version: "1.0"
            data: null
            request_id: "req_notfound_001"
            trace_id: "trace_notfound_001"
            error:
              code: "not_found"
              message: "api key not found"

    ServiceUnavailableEnvelope:
      description: "서비스 사용 불가 — 503 (api key store 미설정 등)"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
          example:
            schema_version: "1.0"
            data: null
            request_id: "req_unavail_001"
            trace_id: "trace_unavail_001"
            error:
              code: "unavailable"
              message: "api key store is not configured"

        "200":
          description: "정상"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: "DB 연결 불량"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ---------------------------------------------------------------------------
  # /me — Bearer auth required
  # ---------------------------------------------------------------------------
  /api/v1/me:
    get:
      tags:
        - Me
      summary: "현재 인증 사용자 profile 조회"
      operationId: getMe
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: "사용자 profile"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  user_id: "alice"
                  email: "alice@example.com"
                  display_name: "Alice Kim"
                  role: "developer"
                  status: "active"
                  idp_subject: "a1b2c3d4-..."
                request_id: "req_abc123"
                trace_id: "trace_xyz789"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
    patch:
      tags:
        - Me
      summary: "내 profile 갱신 (display_name, email, primary_unit_id)"
      operationId: patchMe
      description: |
        현재 인증된 사용자의 display_name, email, primary_unit_id field 갱신.
        ADR-0029: staticTokenAuth (Bearer <DEVHUB_API_KEY>) 도 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: "사용자 표시 이름"
                email:
                  type: string
                  format: email
                  description: "이메일 주소"
                primary_unit_id:
                  type: string
                  description: "소속 조직 단위 ID"
              example:
                display_name: "Alice Kim Updated"
                email: "alice@example.com"
                primary_unit_id: "unit_org_root"
      responses:
        "200":
          description: "갱신된 profile"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  user_id: "alice"
                  email: "alice@example.com"
                  display_name: "Alice Kim Updated"
                  role: "developer"
                  primary_unit_id: "unit_org_root"
                request_id: "req_me_patch_001"
                trace_id: "trace_me_patch_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # /auth/logout — Bearer auth required, 204 | 200
  # ---------------------------------------------------------------------------
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: "OIDC logout + session clear"
      operationId: postAuthLogout
      description: |
        Bearer token 으로 인증된 현재 세션을 로그아웃.
        server-managed cookie 4종 clear + Keycloak OIDC logout endpoint 호출.

        ### 응답 케이스
        - **204** — 로그아웃 성공 (idempotent). refresh_token 미제출 시에도 204.
        - **200** — OIDC logout 호출 성공 시 envelope 응답 (data 에 revoke_status, hotfix_id).
        - **401** — 미인증 또는 invalid token.

        ### N-8 hotfix 4차 (issue #501, 2026-06-09)
        Keycloak network/5xx outage 시에도 **204 + marker headers**로 graceful degrade.
        marker 미부착 시 frontend 는 정상 OIDC end_session_endpoint 호출.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: "OIDC refresh token — optional, 없으면 skip_no_refresh_token"
                id_token:
                  type: string
                  description: "OIDC id_token — optional, audit 용"
      responses:
        "204":
          description: "로그아웃 성공 (idempotent) — Keycloak 정상 또는 graceful degrade"
          headers:
            X-Keycloak-Likely-Down:
              $ref: "#/components/headers/XKeycloakLikelyDown"
            X-Logout-Hotfix:
              $ref: "#/components/headers/XLogoutHotfix"
        "200":
          description: "OIDC logout 호출 성공 — envelope 응답"
          headers:
            X-Keycloak-Likely-Down:
              $ref: "#/components/headers/XKeycloakLikelyDown"
            X-Logout-Hotfix:
              $ref: "#/components/headers/XLogoutHotfix"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  revoke_status: "ok"
                  hotfix_id: "N-8-4:graceful-degrade"
                request_id: "req_def456"
                trace_id: "trace_uvw321"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"

  # ---------------------------------------------------------------------------
  # /metrics — Prometheus exposition, no envelope
  # ---------------------------------------------------------------------------
  /metrics:
    get:
      tags:
        - Operational
      summary: "Prometheus metrics endpoint"
      operationId: getMetrics
      description: |
        Prometheus exposition format (text/plain).
        Keycloak SPI webhook secret 미설정 시 503 envelope error.
      responses:
        "200":
          description: "Prometheus metrics"
          content:
            text/plain:
              schema:
                type: string
                description: "OpenMetrics / Prometheus exposition format"
        "503":
          description: "Keycloak SPI webhook secret 미설정 등 운영 장애"
          $ref: "#/components/responses/ServerErrorEnvelope"

# =============================================================================
# P0 — Profile, Dashboard, Events, Users
# =============================================================================

  # ---------------------------------------------------------------------------
  # POST /api/v1/me/onboarding — onboarding 제출 (P0)
  # ---------------------------------------------------------------------------
  /api/v1/me/onboarding:
    post:
      tags:
        - Me
      summary: "온보딩 workflow 제출"
      operationId: postMeOnboarding
      description: |
        신규 사용자 온보딩 workflow 완료 제출 (organization/unit/role 설정).
        ADR-0029: staticTokenAuth 도 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: "소속 organization ID"
                unit_id:
                  type: string
                  description: "소속 unit ID"
                role_preference:
                  type: string
                  description: "희망 역할 (developer / manager / admin)"
              example:
                organization_id: "org_devhub"
                unit_id: "unit_platform"
                role_preference: "developer"
      responses:
        "200":
          description: "온보딩 완료"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  status: "onboarding_complete"
                  user_id: "alice"
                request_id: "req_onboard_001"
                trace_id: "trace_onboard_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/dashboard/metrics — aggregate dashboard (P0)
  # ---------------------------------------------------------------------------
  /api/v1/dashboard/metrics:
    get:
      tags:
        - Operational
      summary: "대시보드 aggregate 지표"
      operationId: getDashboardMetrics
      description: |
        role=developer 기준 PR/CI/event/risk aggregate 지표.
        ADR-0029: staticTokenAuth 도 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: role
          in: query
          required: false
          schema:
            type: string
            default: developer
          description: "대시보드 역할 필터 (developer / manager / admin)"
      responses:
        "200":
          description: "대시보드 지표"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  pending_prs: 3
                  failing_builds: 1
                  unread_events: 12
                  risk_count: 2
                request_id: "req_dash_001"
                trace_id: "trace_dash_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/events — webhook event list (P0, audit, bearerAuth)
  # ---------------------------------------------------------------------------
  /api/v1/events:
    get:
      tags:
        - Audit
      summary: "Webhook 이벤트 목록 조회"
      operationId: getEvents
      description: |
        Keycloak / Gitea / Integration webhook 이벤트 로그 목록.
        Bearer token (Keycloak) 만 허용 — audit 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: "최대 조회 개수"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: "페이지 오프셋"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
          description: "이벤트 타입 필터 (push / pull_request / keycloak:* / integration:*)"
      responses:
        "200":
          description: "Event 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - event_id: "evt_001"
                      event_type: "push"
                      source: "gitea"
                      created_at: "2026-06-09T10:00:00Z"
                      status: "processed"
                request_id: "req_evt_001"
                trace_id: "trace_evt_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/internal/keycloak-events — Keycloak SPI webhook (P0, no auth)
  # ---------------------------------------------------------------------------
  /api/v1/internal/keycloak-events:
    post:
      tags:
        - Audit
      summary: "Keycloak SPI webhook 수신"
      operationId: postKeycloakEvents
      description: |
        Keycloak SPI 가 전송하는 session/logout event webhook.
        X-Webhook-Secret header 로 서명 검증. Bearer token 불필요.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: X-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
          description: "Webhook 서명 검증 secret — keycloak SPI 와 사전 공유"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  description: "Keycloak event type"
                payload:
                  type: object
                  description: "Keycloak event payload"
              example:
                event_type: "keycloak:session:logout"
                payload:
                  user_id: "a1b2c3d4"
                  timestamp: "2026-06-09T10:00:00Z"
                  realm: "devhub"
      responses:
        "200":
          description: "Webhook 수신 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  status: "accepted"
                  event_id: "evt_kc_001"
                request_id: "req_kc_001"
                trace_id: "trace_kc_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/users — user 목록 (P2, bearerAuth only)
  # POST /api/v1/users — user 생성 (P2, bearerAuth only)
  # ---------------------------------------------------------------------------
  /api/v1/users:
    get:
      tags:
        - Me
      summary: "사용자 목록 조회"
      operationId: listUsers
      description: |
        전체 user 목록 (page 응답). admin / manager 전용.
        본 endpoint 는 admin 영역 — ADR-0029 staticTokenAuth 미허용 (Keycloak 강제).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: "페이지 번호 (1-based)"
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: "페이지 크기 (최대 200)"
      responses:
        "200":
          description: "사용자 page"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - user_id: "alice"
                      email: "alice@example.com"
                      display_name: "Alice Kim"
                      role: "developer"
                      status: "active"
                    - user_id: "bob"
                      email: "bob@example.com"
                      display_name: "Bob Lee"
                      role: "team_manager"
                      status: "active"
                  page: 1
                  page_size: 50
                  total: 27
                request_id: "req_users_list_001"
                trace_id: "trace_users_list_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"
    post:
      tags:
        - Me
      summary: "사용자 생성"
      operationId: createUser
      description: |
        user 생성 (admin 전용). Keycloak IdP 계정은 admin console 에서
        별도 생성되며, 본 endpoint 는 DevHub `users` row 만 생성 (lazy
        auto-create 흡수 + 명시적 pre-seed 통합). ADR-0020 sub-carve B 정합.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            example:
              user_id: "charlie"
              email: "charlie@example.com"
              display_name: "Charlie Park"
              role: "developer"
              primary_unit_id: "unit_platform"
      responses:
        "201":
          description: "user 생성 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  user_id: "charlie"
                  email: "charlie@example.com"
                  display_name: "Charlie Park"
                  role: "developer"
                  status: "active"
                request_id: "req_user_create_001"
                trace_id: "trace_user_create_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
