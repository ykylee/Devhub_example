# DevHub deploy compose — Keycloak 단일 IdP (ADR-0019, 2026-05-19 sprint claude/work_260519-k).
# 단일 포트 reverse proxy 정합(ADR-0018, issue #238). 자세한 SOP 는 docs/setup/keycloak_operations.md.
#
# CLAUDE.md 정책 (`feedback_no_docker.md`) — 환경 특화 자산이므로 git 추적 외 운영도 가능.
# 본 파일은 사내 운영팀이 reference 로 사용. 실 운영 시 env 만 변경.
#
# === Keycloak 두 가지 모드 ===
#
# (1) 로컬 테스트 모드 — compose 가 Keycloak 컨테이너 가동:
#     docker-compose -f docker-compose.deploy.yml \
#       --profile local-idp --profile local-db up -d
#
#     필수 env:
#       KEYCLOAK_HOSTNAME, KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD
#       KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD
#       KEYCLOAK_UPSTREAM=keycloak:8080  (nginx upstream — compose service name)
#       KEYCLOAK_REALM_IMPORT_PATH=./infra/idp/keycloak-realm.dev.json  (default)
#
# (2) 외부 Keycloak 모드 — 사내 운영팀이 별도로 관리:
#     docker-compose -f docker-compose.deploy.yml up -d
#     (--profile local-idp 미활성 → keycloak 컨테이너 미가동)
#
#     필수 env:
#       KEYCLOAK_UPSTREAM=kc.internal.example.com:8443  (외부 Keycloak host:port)
#       DEVHUB_OIDC_ISSUER_URL, DEVHUB_KEYCLOAK_ADMIN_URL 도 외부 URL 로
#       realm 은 외부 운영팀이 keycloak-realm.prod.json 을 reference 로 자체 발급
#
# 자세한 분기 SOP: infra/idp/README.md + infra/nginx/README.md.

services:
  db:
    image: postgres:15
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
    volumes:
      - devhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-devhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devhub-internal

  db-init:
    image: postgres:15
    profiles: ["local-db"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 <<'SQL'
        CREATE SCHEMA IF NOT EXISTS keycloak;
        SQL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devhub-internal

  db-migrate:
    image: migrate/migrate:v4.19.0
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        i=0
        until migrate -path=/migrations -database "$${DB_URL}" up; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then
            echo "db-migrate failed after $$i attempts"
            exit 1
          fi
          echo "db-migrate retry $$i/30"
          sleep 2
        done
    environment:
      DB_URL: ${DB_URL:?set DB_URL}
    volumes:
      - ./backend-core/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
      db-init:
        condition: service_completed_successfully
        required: false
    networks:
      - devhub-internal

  keycloak:
    profiles: ["local-idp"]
    # Keycloak 단일 IdP (ADR-0019). 사내 환경에서는 별도 운영 Keycloak instance 사용 권장 — 본 service 는 1차 reference.
    # version 26.0 (ADR-0023, 2026-05-26 — ADR-0022 25.0 retreat reversal, 사내 재확인 26.x 사용 가능 확정).
  keycloak:
    # P2-6 + X-8 정공법 (2026-06-17 e2e smoke): CI 환경의 keycloak service 가 SPI build
    # 사용. Dockerfile.keycloak 의 multi-stage build (Stage 1: Maven spi-builder → Stage 2:
    # quay.io/keycloak/keycloak:26.0 + SPI JAR copy + kc.sh build auto-config). 의도적 변경:
    # 기존 quay.io/keycloak/keycloak:26.0 image 직접 사용 → Dockerfile.keycloak build 변경
    # (colima / deploy 와 동일 pattern). CI 환경의 SPI e2e smoke 정공법 검증.
    build:
      context: ./infra/idp
      dockerfile: Dockerfile.keycloak
    command:
    command:
      - start
      - --hostname=${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      - --proxy-headers=xforwarded
      - --http-enabled=true
      - --http-port=8080
      - --import-realm
    environment:
      # Admin bootstrap (1차 setup 후 별도 admin user 발급 + 본 env 제거 권장)
      # Keycloak 25 호환: KC_BOOTSTRAP_* + legacy KEYCLOAK_ADMIN* 동시 주입.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Management interface 활성화 (healthcheck 의 /health/ready 응답 필요).
      KC_HEALTH_ENABLED: "true"
      # DB (사내 PostgreSQL 사용)
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:?set KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?set KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA:-keycloak}
      # OIDC / token
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/devhub/auth/keycloak}
      # Logging (운영 정책 별 결정 — 사내 보안팀 SOP 정합)
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
      # P2-6 (Keycloak SPI provider JAR) + X-8 (P3-5 audit event listener push 전환) 정공법
      # 2026-06-17: SPI 가 Keycloak container 의 /opt/keycloak/providers 에 mount 되어
      # boot 시 자동 load. 빌드 산출물 = infra/idp/keycloak-event-listener-spi/target/devhub-keycloak-event-listener.jar
      # (`mvn package` 실행 후). 부재 시 keycloak healthcheck fail → SOP §3 참조.
      # webhook URL = backend container name 기준 internal-only endpoint.
      DEVHUB_BACKEND_SPI_WEBHOOK_URL: "${DEVHUB_BACKEND_SPI_WEBHOOK_URL:-http://backend-core:8080/api/v1/internal/keycloak-events}"
      # shared secret = X-Webhook-Secret header 정합. 사내 운영 vault 별도 관리.
      DEVHUB_KEYCLOAK_SPI_WEBHOOK_SECRET: "${DEVHUB_KEYCLOAK_SPI_WEBHOOK_SECRET:?set DEVHUB_KEYCLOAK_SPI_WEBHOOK_SECRET}"
    volumes:
      # realm-export.json 을 사내 운영 git 외부에서 mount 권장. import-realm 시 1회 적용.
      # 사내 환경 별 realm/client/role 설정은 docs/setup/keycloak_operations.md §2~§4 SOP 따름.
      # 로컬 테스트 모드 기본은 keycloak-realm.dev.json (localhost wildcard 포함).
      # 외부 모드 / 운영 시 keycloak-realm.prod.json 을 reference 로 사내 운영팀이 별도 발급.
      - ${KEYCLOAK_REALM_IMPORT_PATH:-./infra/idp/keycloak-realm.dev.json}:/opt/keycloak/data/import/realm.json:ro
      # P2-6 + X-8 정공법 — SPI JAR mount (Keycloak boot 시 auto-load)
      - ./infra/idp/keycloak-event-listener-spi/target/devhub-keycloak-event-listener.jar:/opt/keycloak/providers/devhub-keycloak-event-listener.jar:ro
    expose:
      - "8080"
    healthcheck:
      # Keycloak 26.x 의 management interface 는 :9000/health/ready (KC_HEALTH_ENABLED=true
      # 환경변수로 활성). distroless image 라 wget/curl 부재 — bash builtin /dev/tcp 사용.
      # /health/ready 가 ready 면 realm import + DB migration 완료.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - devhub-internal

  backend-ai:
    image: ${IMAGE_REPO_PREFIX:-ghcr.io/ykylee/devhub_example}/backend-ai:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      # backend-ai/main.py 의 GET /health (FastAPI). wget/curl 둘 다 image 에 없을 수
      # 있어 python 으로 fallback (slim image 도 python 보유).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - devhub-internal

  backend-core:
    image: ${IMAGE_REPO_PREFIX:-ghcr.io/ykylee/devhub_example}/backend-core:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL:?set DB_URL}
      BACKEND_AI_URL: ${BACKEND_AI_URL:-http://backend-ai:8000}
      DEVHUB_AUTH_DEV_FALLBACK: ${DEVHUB_AUTH_DEV_FALLBACK:-0}
      # RM-ONBOARD-01 (ADR-0021 §3.3) — default true (운영 안전). 내부 Keycloak
      # 테스트 시점에 admin pre-seed 없이 Keycloak 계정을 자유롭게 사용하려면
      # `DEVHUB_ONBOARDING_GATE_ENABLED=0` 으로 backend gate 해제. frontend
      # AuthGuard 는 첫 진입 시 /onboarding 으로 redirect 하지만, 사용자가 'Skip'
      # 한 번 클릭하면 localStorage 에 저장되어 이후 자유 진입 가능.
      DEVHUB_ONBOARDING_GATE_ENABLED: ${DEVHUB_ONBOARDING_GATE_ENABLED:-1}
      # Keycloak 단일 IdP (ADR-0019 §4.2 환경설정 계약)
      DEVHUB_IDP_PROVIDER: ${DEVHUB_IDP_PROVIDER:-keycloak}
      DEVHUB_OIDC_ISSUER_URL: ${DEVHUB_OIDC_ISSUER_URL:?set DEVHUB_OIDC_ISSUER_URL}
      DEVHUB_OIDC_CLIENT_ID: ${DEVHUB_OIDC_CLIENT_ID:-devhub-frontend}
      DEVHUB_OIDC_CLIENT_SECRET: ${DEVHUB_OIDC_CLIENT_SECRET:?set DEVHUB_OIDC_CLIENT_SECRET}
      DEVHUB_OIDC_AUDIENCE: ${DEVHUB_OIDC_AUDIENCE:-devhub-frontend}
      DEVHUB_OIDC_JWKS_URL: ${DEVHUB_OIDC_JWKS_URL:-}
      DEVHUB_KEYCLOAK_ADMIN_URL: ${DEVHUB_KEYCLOAK_ADMIN_URL:?set DEVHUB_KEYCLOAK_ADMIN_URL}
      DEVHUB_KEYCLOAK_ADMIN_REALM: ${DEVHUB_KEYCLOAK_ADMIN_REALM:-devhub}
      DEVHUB_KEYCLOAK_ADMIN_CLIENT_ID: ${DEVHUB_KEYCLOAK_ADMIN_CLIENT_ID:-devhub-backend}
      DEVHUB_KEYCLOAK_ADMIN_CLIENT_SECRET: ${DEVHUB_KEYCLOAK_ADMIN_CLIENT_SECRET:?set DEVHUB_KEYCLOAK_ADMIN_CLIENT_SECRET}
      # nginx reverse proxy 뒤 운영 시 X-Forwarded-* 신뢰 범위 (docker bridge CIDR)
      DEVHUB_TRUSTED_PROXIES: ${DEVHUB_TRUSTED_PROXIES:-172.16.0.0/12}
    depends_on:
      backend-ai:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      # backend-core 의 GET /health (router.go:186). distroless/scratch image 면 wget 부재 가능 —
      # native http via /proc/net/tcp ping fallback 필요. 1차는 wget BusyBox 가정.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - devhub-internal

  frontend:
    image: ${IMAGE_REPO_PREFIX:-ghcr.io/ykylee/devhub_example}/frontend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend-core:8080}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-devhub}
      # DEVHUB_PUBLIC_BASE_URL 는 server-side runtime-config route 가 redirect
      # URI 생성에 사용 — runtime env 로 inject 가능. primary path.
      DEVHUB_PUBLIC_BASE_URL: ${DEVHUB_PUBLIC_BASE_URL:?set DEVHUB_PUBLIC_BASE_URL}
      # NOTE — NEXT_PUBLIC_APP_ORIGIN 은 `endpoints.ts` 가 client-side bundle 에서
      # 참조하는 fallback 변수다. Next.js `NEXT_PUBLIC_*` 변수는 **build-time** 에
      # bundle 에 inline 되며, 본 deploy compose 는 build 없이 image 만 사용하므로
      # runtime env 로 set 해도 client bundle 에 반영되지 않는다. 즉 본 line 은
      # **dead set** — client-side fallback 은 `window.location.origin` 으로 자연
      # fallback 한다 (intended behavior — frontend image 환경간 재사용 + OIDC
      # endpoint 는 runtime-config route 가 primary 로 동적 주입). image build 시점에
      # 환경별 NEXT_PUBLIC_APP_ORIGIN 을 inline 하고 싶으면 frontend Dockerfile 의
      # build-arg 로 전달해야 한다 (운영 환경별 image 분리 패턴).
      # (PR #278 review P2 #1 정합 — claude follow-up)
      NEXT_PUBLIC_APP_ORIGIN: ${DEVHUB_PUBLIC_BASE_URL:?set DEVHUB_PUBLIC_BASE_URL}
      # Runtime config route(frontend/app/api/runtime-config) fallback overrides.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?set OIDC_REDIRECT_URI}
      # OIDC discovery 기반 — issuer URL 만 명시 + 나머지는 frontend OIDC client 가 discovery
      NEXT_PUBLIC_OIDC_ISSUER_URL: ${NEXT_PUBLIC_OIDC_ISSUER_URL:?set NEXT_PUBLIC_OIDC_ISSUER_URL}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-devhub-frontend}
      NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:?set NEXT_PUBLIC_OIDC_REDIRECT_URI}
      NEXT_PUBLIC_OIDC_SCOPE: ${NEXT_PUBLIC_OIDC_SCOPE:-openid offline_access email profile}
    depends_on:
      backend-core:
        condition: service_healthy
    healthcheck:
      # Next.js standalone server. /api/runtime-config (frontend/app/api/runtime-config/route.ts)
      # 는 항상 200 응답 (build env fallback). basePath 활성 시 /devhub prefix.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/${NEXT_PUBLIC_BASE_PATH:-devhub}/api/runtime-config || wget -q -O- http://127.0.0.1:3000/api/runtime-config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - devhub-internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    environment:
      # nginx 공식 이미지의 envsubst entrypoint 가 /etc/nginx/templates/*.template 의
      # ${VAR} placeholder 를 치환한 뒤 /etc/nginx/conf.d/ 로 emit 한다.
      # KEYCLOAK_UPSTREAM 의 모드 분기: 로컬 = keycloak:8080 / 외부 = kc.example.com:port.
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-keycloak:8080}
      # KEYCLOAK_ADMIN_ALLOW_CIDR 미설정 시 admin path 외부 노출 차단 (deny all).
      # backend 는 keycloak:8080 (또는 외부 internal-only URL) 로 직접 통신 사용.
      KEYCLOAK_ADMIN_ALLOW_CIDR: ${KEYCLOAK_ADMIN_ALLOW_CIDR:-127.0.0.1/32}
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/devhub.deploy.conf.template:/etc/nginx/templates/devhub.deploy.conf.template:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - devhub-internal

volumes:
  devhub-postgres:

networks:
  devhub-internal:
