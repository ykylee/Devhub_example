name: devhub-dogfood

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
    ports:
      - "${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - dogfood-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:15
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 <<'SQL'
        CREATE SCHEMA IF NOT EXISTS keycloak;
        SQL
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    build:
      context: ./infra/idp
      dockerfile: Dockerfile.keycloak
    restart: unless-stopped
    command:
      - start
      - --hostname=${KEYCLOAK_HOSTNAME:-http://localhost:18180/devhub/auth/keycloak}
      - --proxy-headers=xforwarded
      - --http-enabled=true
      - --http-port=8080
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KEYCLOAK_ADMIN: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://db:5432/devhub}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-your_password}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA:-keycloak}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/devhub/auth/keycloak}
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
      # P2-6 (Keycloak SPI provider JAR) + X-8 (P3-5 audit event listener push 전환) 정공법
      # 2026-06-17: SPI 가 cloud-native env-var wire 이므로 standalone.xml 의 SPI 등록 불필요.
      # webhook URL = backend container name 기준 internal-only endpoint.
      DEVHUB_BACKEND_SPI_WEBHOOK_URL: "http://backend-core:8080/api/v0-1/internal/keycloak-events"
      # shared secret = X-Webhook-Secret header 정합. CI/test 환경 default = "devhub-spi-secret" (정합 확인).
      DEVHUB_KEYCLOAK_SPI_WEBHOOK_SECRET: "${DEVHUB_KEYCLOAK_SPI_WEBHOOK_SECRET:-devhub-spi-secret}"
    ports:
      - "${KEYCLOAK_HOST_PORT:-18180}:8080"
    volumes:
      - ${KEYCLOAK_REALM_IMPORT_PATH:-./infra/idp/keycloak-realm.dev.json}:/opt/keycloak/data/import/realm.json:ro
      # P2-6 + X-8 — SPI JAR mount (Keycloak boot 시 auto-load)
      # JAR 빌드 결과 = infra/idp/keycloak-event-listener-spi/target/devhub-keycloak-event-listener.jar
      # (`mvn package` 실행 후). 빌드 산출물 부재 시 keycloak healthcheck fail → SOP §2 참조.
      - ./infra/idp/keycloak-event-listener-spi/target/devhub-keycloak-event-listener.jar:/opt/keycloak/providers/devhub-keycloak-event-listener.jar:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

volumes:
  dogfood-postgres:
