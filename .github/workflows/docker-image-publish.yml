name: Docker Image Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (optional). Defaults to git SHA."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push (backend-core, backend-ai, frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_SHA}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend-core
        uses: docker/build-push-action@v6
        with:
          context: ./backend-core
          file: ./backend-core/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/backend-core:${{ steps.vars.outputs.tag }}

      - name: Build and push backend-ai
        uses: docker/build-push-action@v6
        with:
          context: ./backend-ai
          file: ./backend-ai/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/backend-ai:${{ steps.vars.outputs.tag }}

      # OIDC URL 은 image 빌드 시점에 박지 않는다 — 운영 환경별 외부 Keycloak 주소가 달라지므로
      # 런타임에 /api/runtime-config (frontend/app/api/runtime-config/route.ts) + OIDC discovery
      # 로 해결한다 (ADR-0019 §4.2 환경설정 계약 + ADR-0018 §3.3 단일 포트 정합).
      # 과거에 NEXT_PUBLIC_OIDC_AUTH_URL / NEXT_PUBLIC_OIDC_REDIRECT_URI build-arg 가 있었으나
      # 2026-05-20 docs/reports/2026-05-20-network-docker-single-port-review.md §4.1 정정.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            BACKEND_API_URL=http://backend-core:8080
          tags: |
            ${{ steps.vars.outputs.registry }}/frontend:${{ steps.vars.outputs.tag }}

      - name: Summary
        run: |
          {
            echo "## Docker image publish"
            echo ""
            echo "- Registry prefix: \`${{ steps.vars.outputs.registry }}\`"
            echo "- Tag: \`${{ steps.vars.outputs.tag }}\`"
            echo "- Images:"
            echo "  - \`${{ steps.vars.outputs.registry }}/backend-core:${{ steps.vars.outputs.tag }}\`"
            echo "  - \`${{ steps.vars.outputs.registry }}/backend-ai:${{ steps.vars.outputs.tag }}\`"
            echo "  - \`${{ steps.vars.outputs.registry }}/frontend:${{ steps.vars.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
