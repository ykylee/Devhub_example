<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevHub API</title>
  <link rel="stylesheet" href="./swagger-ui.css" />
  <style>html{box-sizing:border-box}body{margin:0;background:#fafafa}#swagger-ui{max-width:1460px;margin:0 auto;padding:20px}</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="./swagger-ui-bundle.js"></script>
  <script src="./swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      // Derive the directory base from window.location.pathname. Drop the
      // last segment only when it looks like a file; directory-only
      // pathnames (e.g. /swagger/, /devhub/swagger/) stay intact so the
      // router.StaticFS-mounted default /swagger/openapi.yaml is preserved.
      const pathname = window.location.pathname;
      const trimmed = pathname.replace(/\/+$/, "") || "/";
      const lastSlash = trimmed.lastIndexOf("/");
      const lastSeg = lastSlash >= 0 ? trimmed.slice(lastSlash + 1) : "";
      const base = lastSeg.includes(".")
        ? (lastSlash > 0 ? trimmed.slice(0, lastSlash + 1) : "/")
        : (pathname.endsWith("/") ? pathname : pathname + "/");
      window.ui = SwaggerUIBundle({
        url: base + "openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        persistAuthorization: true
      });
    };
  </script>
</body>
</html>
