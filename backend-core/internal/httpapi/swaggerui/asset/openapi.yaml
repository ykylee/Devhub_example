          $ref: "#/components/responses/ServerErrorEnvelope"
    post:
      tags:
        - DevRequest
      summary: "DevRequest 접수 (intake token)"
      operationId: createDevRequest
      description: |
        외부/내부 개발 요청 접수. X-Intake-Token header 로 검증.
        Bearer token 불필요 — intake 전용.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: X-Intake-Token
          in: header
          required: true
          schema:
            type: string
          description: "DREQ intake token — 사전 발급된 요청 key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: "요청 제목"
                description:
                  type: string
                  description: "요청 상세"
                priority:
                  type: string
                  description: "우선순위 (P0 / P1 / P2 / P3)"
                requester_contact:
                  type: string
                  description: "요청자 연락처 (email / slack)"
              required:
                - title
              example:
                title: "Add CSV export for audit logs"
                description: "Need REST endpoint to export audit logs as CSV for compliance"
                priority: "P1"
                requester_contact: "bob@example.com"
      responses:
        "201":
          description: "DREQ 접수 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  id: "dreq_new_001"
                  status: "pending"
                  intake_token_used: true
                request_id: "req_dreq_create"
                trace_id: "trace_dreq_create"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

