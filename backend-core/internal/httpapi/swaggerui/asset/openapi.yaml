openapi: "3.0.3"
info:
  title: "DevHub API"
  version: "0.1.0-v1.0-bootstrap"
  description: |
    DevHub v1.0 출시 직전 bootstrap. 1차 MVP scope:
    envelope 규약 + health + /me + /auth/logout + /metrics.
    도메인 endpoint 100+ (platform, repository, project, integration, DREQ 등)는
    별도 sprint — 본 spec 에 미포함.

    ## Envelope 규약
    - 성공: `{schema_version, data, request_id, trace_id}`
    - 실패: `{schema_version, data: null, request_id, trace_id, error: {code, message, details?}}`
    - `/health` 는 envelope 미사용 (raw 200).

    ## 인증
    - Bearer token (Keycloak OIDC access token, ADR-0019).
    - `/me`, `/api/v1/auth/logout` 만 `security: [{bearerAuth}]` 적용.

    ## 참고 — swagger self-link
    본 파일은 `docs/openapi.yaml` 로 직접 hand-maintain.
    Swagger UI 에서 self-link 로 표시할 경우 `/docs/openapi.yaml` 참조.

servers:
  - url: "http://localhost:8080"
    description: "local dev"

tags:
  - name: System
    description: "서비스 상태 확인 — 인증 불필요."
  - name: Auth
    description: "OIDC 기반 로그아웃 — Bearer token 필요."
  - name: Me
    description: "현재 인증된 사용자 profile 조회 — Bearer token 필요."
  - name: Operational
    description: "Prometheus 메트릭 노출 및 운영 endpoint."
  - name: Platform
    description: "Application platform 관리 (API-43..50)."
  - name: Project
    description: "Project 관리 (API-55..56)."
  - name: Repository
    description: "Repository 관리 + 운영 지표 (API-15..23, API-51..54)."
  - name: Integration
    description: "Integration provider + binding + SCM (API-58, API-69..90)."
  - name: RiskCommand
    description: "Risk mitigation + command approval (API-39..43, API-31..32)."
  - name: CI
    description: "CI run + log (API-28..30)."
  - name: DevRequest
    description: "DREQ intake + 조회 + admin token (API-59..68, API-79)."
  - name: Infra
    description: "Infra topology / nodes / edges / services (API-9..14, API-76..78)."
  - name: Organization
    description: "Organization hierarchy + units (API-49..56)."
  - name: Audit
    description: "Audit log + webhook events."
  - name: SCM
    description: "SCM provider catalog (API-41..42)."
  - name: HR
    description: "HR DB lookup."
  - name: Realtime
    description: "WebSocket ticket (ADR-0024)."
  - name: ExternalTask
    description: "External task item (API-94..96)."

paths:
  # ---------------------------------------------------------------------------
  # Health — no envelope, raw JSON
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags:
        - System
      summary: "Go Core 상태 확인"
      operationId: getHealth
      description: |
        backend-core health check. envelope 미사용 — raw JSON 응답.
        DB 연결이 없으면 db=disabled, 연결 불량이면 503.
      responses:
        "200":
          description: "정상"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: "DB 연결 불량"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ---------------------------------------------------------------------------
  # /me — Bearer auth required
  # ---------------------------------------------------------------------------
  /api/v1/me:
    get:
      tags:
        - Me
      summary: "현재 인증 사용자 profile 조회"
      operationId: getMe
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: "사용자 profile"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  user_id: "alice"
                  email: "alice@example.com"
                  display_name: "Alice Kim"
                  role: "developer"
                  status: "active"
                  idp_subject: "a1b2c3d4-..."
                request_id: "req_abc123"
                trace_id: "trace_xyz789"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
    patch:
      tags:
        - Me
      summary: "내 profile 갱신 (display_name, email, primary_unit_id)"
      operationId: patchMe
      description: |
        현재 인증된 사용자의 display_name, email, primary_unit_id field 갱신.
        ADR-0029: staticTokenAuth (Bearer <DEVHUB_API_KEY>) 도 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: "사용자 표시 이름"
                email:
                  type: string
                  format: email
                  description: "이메일 주소"
                primary_unit_id:
                  type: string
                  description: "소속 조직 단위 ID"
              example:
                display_name: "Alice Kim Updated"
                email: "alice@example.com"
                primary_unit_id: "unit_org_root"
      responses:
        "200":
          description: "갱신된 profile"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  user_id: "alice"
                  email: "alice@example.com"
                  display_name: "Alice Kim Updated"
                  role: "developer"
                  primary_unit_id: "unit_org_root"
                request_id: "req_me_patch_001"
                trace_id: "trace_me_patch_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # /auth/logout — Bearer auth required, 204 | 200
  # ---------------------------------------------------------------------------
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: "OIDC logout + session clear"
      operationId: postAuthLogout
      description: |
        Bearer token 으로 인증된 현재 세션을 로그아웃.
        server-managed cookie 4종 clear + Keycloak OIDC logout endpoint 호출.

        ### 응답 케이스
        - **204** — 로그아웃 성공 (idempotent). refresh_token 미제출 시에도 204.
        - **200** — OIDC logout 호출 성공 시 envelope 응답 (data 에 revoke_status, hotfix_id).
        - **401** — 미인증 또는 invalid token.

        ### N-8 hotfix 4차 (issue #501, 2026-06-09)
        Keycloak network/5xx outage 시에도 **204 + marker headers**로 graceful degrade.
        marker 미부착 시 frontend 는 정상 OIDC end_session_endpoint 호출.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: "OIDC refresh token — optional, 없으면 skip_no_refresh_token"
                id_token:
                  type: string
                  description: "OIDC id_token — optional, audit 용"
      responses:
        "204":
          description: "로그아웃 성공 (idempotent) — Keycloak 정상 또는 graceful degrade"
          headers:
            X-Keycloak-Likely-Down:
              $ref: "#/components/headers/XKeycloakLikelyDown"
            X-Logout-Hotfix:
              $ref: "#/components/headers/XLogoutHotfix"
        "200":
          description: "OIDC logout 호출 성공 — envelope 응답"
          headers:
            X-Keycloak-Likely-Down:
              $ref: "#/components/headers/XKeycloakLikelyDown"
            X-Logout-Hotfix:
              $ref: "#/components/headers/XLogoutHotfix"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  revoke_status: "ok"
                  hotfix_id: "N-8-4:graceful-degrade"
                request_id: "req_def456"
                trace_id: "trace_uvw321"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"

  # ---------------------------------------------------------------------------
  # /metrics — Prometheus exposition, no envelope
  # ---------------------------------------------------------------------------
  /metrics:
    get:
      tags:
        - Operational
      summary: "Prometheus metrics endpoint"
      operationId: getMetrics
      description: |
        Prometheus exposition format (text/plain).
        Keycloak SPI webhook secret 미설정 시 503 envelope error.
      responses:
        "200":
          description: "Prometheus metrics"
          content:
            text/plain:
              schema:
                type: string
                description: "OpenMetrics / Prometheus exposition format"
        "503":
          description: "Keycloak SPI webhook secret 미설정 등 운영 장애"
          $ref: "#/components/responses/ServerErrorEnvelope"

# =============================================================================
# P0 — Profile, Dashboard, Events, Users
# =============================================================================

  # ---------------------------------------------------------------------------
  # POST /api/v1/me/onboarding — onboarding 제출 (P0)
  # ---------------------------------------------------------------------------
  /api/v1/me/onboarding:
    post:
      tags:
        - Me
      summary: "온보딩 workflow 제출"
      operationId: postMeOnboarding
      description: |
        신규 사용자 온보딩 workflow 완료 제출 (organization/unit/role 설정).
        ADR-0029: staticTokenAuth 도 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: "소속 organization ID"
                unit_id:
                  type: string
                  description: "소속 unit ID"
                role_preference:
                  type: string
                  description: "희망 역할 (developer / manager / admin)"
              example:
                organization_id: "org_devhub"
                unit_id: "unit_platform"
                role_preference: "developer"
      responses:
        "200":
          description: "온보딩 완료"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  status: "onboarding_complete"
                  user_id: "alice"
                request_id: "req_onboard_001"
                trace_id: "trace_onboard_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/dashboard/metrics — aggregate dashboard (P0)
  # ---------------------------------------------------------------------------
  /api/v1/dashboard/metrics:
    get:
      tags:
        - Operational
      summary: "대시보드 aggregate 지표"
      operationId: getDashboardMetrics
      description: |
        role=developer 기준 PR/CI/event/risk aggregate 지표.
        ADR-0029: staticTokenAuth 도 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: role
          in: query
          required: false
          schema:
            type: string
            default: developer
          description: "대시보드 역할 필터 (developer / manager / admin)"
      responses:
        "200":
          description: "대시보드 지표"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  pending_prs: 3
                  failing_builds: 1
                  unread_events: 12
                  risk_count: 2
                request_id: "req_dash_001"
                trace_id: "trace_dash_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/events — webhook event list (P0, audit, bearerAuth)
  # ---------------------------------------------------------------------------
  /api/v1/events:
    get:
      tags:
        - Audit
      summary: "Webhook 이벤트 목록 조회"
      operationId: getEvents
      description: |
        Keycloak / Gitea / Integration webhook 이벤트 로그 목록.
        Bearer token (Keycloak) 만 허용 — audit 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: "최대 조회 개수"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: "페이지 오프셋"
        - name: event_type
          in: query
          required: false
          schema:
            type: string
          description: "이벤트 타입 필터 (push / pull_request / keycloak:* / integration:*)"
      responses:
        "200":
          description: "Event 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - event_id: "evt_001"
                      event_type: "push"
                      source: "gitea"
                      created_at: "2026-06-09T10:00:00Z"
                      status: "processed"
                request_id: "req_evt_001"
                trace_id: "trace_evt_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/internal/keycloak-events — Keycloak SPI webhook (P0, no auth)
  # ---------------------------------------------------------------------------
  /api/v1/internal/keycloak-events:
    post:
      tags:
        - Audit
      summary: "Keycloak SPI webhook 수신"
      operationId: postKeycloakEvents
      description: |
        Keycloak SPI 가 전송하는 session/logout event webhook.
        X-Webhook-Secret header 로 서명 검증. Bearer token 불필요.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: X-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
          description: "Webhook 서명 검증 secret — keycloak SPI 와 사전 공유"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  description: "Keycloak event type"
                payload:
                  type: object
                  description: "Keycloak event payload"
              example:
                event_type: "keycloak:session:logout"
                payload:
                  user_id: "a1b2c3d4"
                  timestamp: "2026-06-09T10:00:00Z"
                  realm: "devhub"
      responses:
        "200":
          description: "Webhook 수신 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  status: "accepted"
                  event_id: "evt_kc_001"
                request_id: "req_kc_001"
                trace_id: "trace_kc_001"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/users/{user_id} — user 조회 (P0 bonus, bearerAuth)
  # ---------------------------------------------------------------------------
  /api/v1/users/{user_id}:
    get:
      tags:
        - Me
      summary: "사용자 정보 조회"
      operationId: getUserById
      description: |
        user_id 로 사용자 profile 조회. admin / manager 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: "조회할 사용자 ID"
      responses:
        "200":
          description: "사용자 profile"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  user_id: "bob"
                  email: "bob@example.com"
                  display_name: "Bob Lee"
                  role: "manager"
                  status: "active"
                  idp_subject: "x9y8z7w6-..."
                request_id: "req_user_001"
                trace_id: "trace_user_001"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

# =============================================================================
# P1 — Platform CRUD
# =============================================================================

  # ---------------------------------------------------------------------------
  # GET /api/v1/platforms — platform 목록 (P1)
  # ---------------------------------------------------------------------------
  /api/v1/platforms:
    get:
      tags:
        - Platform
      summary: "Platform 목록 조회"
      operationId: listPlatforms
      description: |
        등록된 application platform 목록.
        ADR-0029: staticTokenAuth 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: "상태 필터 (active / archived)"
      responses:
        "200":
          description: "Platform 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - id: "plat_001"
                      name: "devhub-core"
                      description: "DevHub backend core platform"
                      status: "active"
                      repository_count: 5
                      created_at: "2026-01-15T00:00:00Z"
                request_id: "req_plat_list"
                trace_id: "trace_plat_list"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

    post:
      tags:
        - Platform
      summary: "Platform 생성 (admin)"
      operationId: createPlatform
      description: |
        새 application platform 등록. admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Platform 이름 (고유)"
                description:
                  type: string
                  description: "Platform 설명"
              required:
                - name
              example:
                name: "new-platform"
                description: "New application platform"
      responses:
        "201":
          description: "Platform 생성 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  id: "plat_new_001"
                  name: "new-platform"
                  status: "active"
                  created_at: "2026-06-09T12:00:00Z"
                request_id: "req_plat_create"
                trace_id: "trace_plat_create"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/platforms/{platform_id} — platform 상세 (P1)
  # ---------------------------------------------------------------------------
  /api/v1/platforms/{platform_id}:
    get:
      tags:
        - Platform
      summary: "Platform 상세 조회"
      operationId: getPlatformById
      description: |
        platform_id 기준 단일 platform 상세 정보.
        ADR-0029: staticTokenAuth 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: platform_id
          in: path
          required: true
          schema:
            type: string
          description: "Platform ID"
      responses:
        "200":
          description: "Platform 상세"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  id: "plat_001"
                  name: "devhub-core"
                  description: "DevHub backend core platform"
                  status: "active"
                  repository_count: 5
                  project_count: 3
                  created_at: "2026-01-15T00:00:00Z"
                request_id: "req_plat_get"
                trace_id: "trace_plat_get"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

    patch:
      tags:
        - Platform
      summary: "Platform 갱신 (admin)"
      operationId: updatePlatform
      description: |
        platform metadata 갱신. admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: platform_id
          in: path
          required: true
          schema:
            type: string
