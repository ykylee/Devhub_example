  # ---------------------------------------------------------------------------
  # GET /api/v1/organization/units/{unit_id} — 조직 unit 상세 (P1)
  # ---------------------------------------------------------------------------
  /api/v1/organization/units/{unit_id}:
    get:
      tags:
        - Organization
      summary: "조직 unit 상세 조회"
      operationId: getOrganizationUnitById
      description: |
        unit_id 기준 조직 unit 상세 + member 목록.
        ADR-0029: staticTokenAuth 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: unit_id
          in: path
          required: true
          schema:
            type: string
          description: "조직 unit ID"
      responses:
        "200":
          description: "Unit 상세"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  unit_id: "unit_platform"
                  name: "Platform Team"
                  parent_organization_id: "org_devhub"
                  member_count: 12
                  teams:
                    - team_id: "team_api"
                      name: "API Team"
                    - team_id: "team_ui"
                      name: "UI Team"
                request_id: "req_org_unit"
                trace_id: "trace_org_unit"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/organizations/search — organization 검색 (P1)
  # ---------------------------------------------------------------------------
  /api/v1/organizations/search:
    get:
      tags:
        - Organization
      summary: "Organization 검색"
      operationId: searchOrganizations
      description: |
        organization 이름/키워드 검색.
        ADR-0029: staticTokenAuth 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: "검색어"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: "최대 결과 개수"
      responses:
        "200":
          description: "검색 결과"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - organization_id: "org_devhub"
                      name: "DevHub"
                      description: "DevHub organization"
                request_id: "req_org_search"
                trace_id: "trace_org_search"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

# =============================================================================
# P1 — Audit / Command / HR / Realtime
# =============================================================================

  # ---------------------------------------------------------------------------
  # GET /api/v1/audit-logs — audit log 목록 (admin, bearerAuth)
  # ---------------------------------------------------------------------------
  /api/v1/audit-logs:
    get:
      tags:
        - Audit
      summary: "Audit log 목록 조회 (admin)"
      operationId: listAuditLogs
      description: |
        시스템 audit log (user action / admin action / security event). admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: actor
          in: query
          required: false
          schema:
            type: string
          description: "행위자 ID 필터"
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: "Action 타입 필터 (create / update / delete / login / logout)"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "시작 시각"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "종료 시각"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: "최대 조회 개수"
      responses:
        "200":
          description: "Audit log 목록"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - log_id: "audit_001"
                      timestamp: "2026-06-09T10:00:00Z"
                      actor: "alice"
                      action: "update"
                      resource: "platform:plat_001"
                      details:
                        field: "description"
                        old_value: "old desc"
                        new_value: "new desc"
                request_id: "req_audit_list"
                trace_id: "trace_audit_list"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/commands/{command_id} — command 상태 조회 (admin, bearerAuth)
  # ---------------------------------------------------------------------------
  /api/v1/commands/{command_id}:
    get:
      tags:
        - RiskCommand
      summary: "Command 상태 조회 (admin)"
      operationId: getCommandById
      description: |
        비동기 command (mitigation / approval) 상태 조회. admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: command_id
          in: path
          required: true
          schema:
            type: string
          description: "Command ID"
      responses:
        "200":
          description: "Command 상태"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  command_id: "cmd_001"
                  type: "risk_mitigation"
                  status: "executing"
                  progress_pct: 65
                  started_at: "2026-06-09T10:00:00Z"
                request_id: "req_cmd_get"
                trace_id: "trace_cmd_get"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "404":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # GET /api/v1/hr/lookup — HR DB lookup (admin, bearerAuth)
  # ---------------------------------------------------------------------------
  /api/v1/hr/lookup:
    get:
      tags:
        - HR
      summary: "HR DB lookup (admin)"
      operationId: getHrLookup
      description: |
        HR 데이터베이스 사용자/조직 lookup. admin 전용.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: "검색어 (이름 / 이메일 / 사번)"
      responses:
        "200":
          description: "HR lookup 결과"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  items:
                    - employee_id: "EMP001"
                      name: "Alice Kim"
                      email: "alice@example.com"
                      department: "Engineering"
                      title: "Senior Developer"
                request_id: "req_hr_lookup"
                trace_id: "trace_hr_lookup"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

  # ---------------------------------------------------------------------------
  # POST /api/v1/realtime/ticket — WebSocket ticket 발급 (P1)
  # ---------------------------------------------------------------------------
  /api/v1/realtime/ticket:
    post:
      tags:
        - Realtime
      summary: "WebSocket 연결 ticket 발급"
      operationId: postRealtimeTicket
      description: |
        WebSocket 연결용 일회용 ticket 발급. ADR-0024.
        ADR-0029: staticTokenAuth 도 허용.
      security:
        - bearerAuth: []
        - staticTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  description: "WebSocket channel (events / dashboard / admin)"
              required:
                - channel
              example:
                channel: "events"
      responses:
        "200":
          description: "Ticket 발급 성공"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                schema_version: "1.0"
                data:
                  ticket: "wss_ticket_abc123"
                  expires_in_sec: 300
                  ws_url: "wss://devhub.example.com/ws?ticket=wss_ticket_abc123"
                request_id: "req_rt_ticket"
                trace_id: "trace_rt_ticket"
        "400":
          $ref: "#/components/responses/BadRequestEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedEnvelope"
        "503":
          $ref: "#/components/responses/ServerErrorEnvelope"

# =============================================================================
# Components
# =============================================================================
components:
  schemas:
    # -----------------------------------------------------------------------
    # Envelope — 성공
    # -----------------------------------------------------------------------
    Envelope:
      type: object
      required:
        - schema_version
        - data
        - request_id
        - trace_id
      properties:
        schema_version:
          type: string
          description: "Envelope schema version — 현재 \"1.0\""
          example: "1.0"
        data:
          description: "응답 payload — endpoint 별 schema"
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - $ref: "#/components/schemas/LogoutData"
            - $ref: "#/components/schemas/PaginatedResponse"
            - $ref: "#/components/schemas/UserSummaryExtended"
            - $ref: "#/components/schemas/OnboardingSubmissionResponse"
            - $ref: "#/components/schemas/AuthError"
            - $ref: "#/components/schemas/Organization"
            - $ref: "#/components/schemas/OrgUnit"
            - $ref: "#/components/schemas/OrganizationSearchResult"
            - $ref: "#/components/schemas/Platform"
            - $ref: "#/components/schemas/PlatformRepository"
            - $ref: "#/components/schemas/Project"
            - $ref: "#/components/schemas/PlatformRollup"
            - $ref: "#/components/schemas/PlatformDashboard"
            - $ref: "#/components/schemas/Repository"
            - $ref: "#/components/schemas/RepositoryActivity"
            - $ref: "#/components/schemas/PullRequestSummary"
            - $ref: "#/components/schemas/BuildRunSummary"
            - $ref: "#/components/schemas/QualitySnapshot"
            - $ref: "#/components/schemas/IssueSummary"
            - $ref: "#/components/schemas/Risk"
            - $ref: "#/components/schemas/Command"
            - $ref: "#/components/schemas/CIRun"
            - $ref: "#/components/schemas/CIRunLog"
            - $ref: "#/components/schemas/IntegrationProvider"
            - $ref: "#/components/schemas/IntegrationBinding"
            - $ref: "#/components/schemas/IntegrationTestResult"
            - $ref: "#/components/schemas/InfraTopology"
            - $ref: "#/components/schemas/InfraService"
            - $ref: "#/components/schemas/DashboardMetrics"
            - $ref: "#/components/schemas/AuditLog"
            - $ref: "#/components/schemas/WebhookEvent"
            - $ref: "#/components/schemas/RBACPolicy"
            - $ref: "#/components/schemas/DevRequest"
            - $ref: "#/components/schemas/DevRequestIntakeToken"
            - $ref: "#/components/schemas/ExternalTaskItem"
            - $ref: "#/components/schemas/HRDBLookupResult"
            - $ref: "#/components/schemas/RealtimeTicket"
        request_id:
          type: string
          description: "X-Request-ID header 와 동일한 correlation ID"
          example: "req_abc123"
        trace_id:
          type: string
          description: "분산 추적 trace ID"
          example: "trace_xyz789"

    # -----------------------------------------------------------------------
    # EnvelopeError — 실패
    # -----------------------------------------------------------------------
    EnvelopeError:
      type: object
      required:
        - schema_version
        - data
        - request_id
        - trace_id
        - error
      properties:
        schema_version:
          type: string
          example: "1.0"
        data:
          type: "null"
          description: "실패 시 항상 null"
        request_id:
          type: string
          example: "req_abc123"
        trace_id:
          type: string
          example: "trace_xyz789"
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: "사람 가독 에러 메시지"
              example: "invalid bearer token"
            details:
              type: string
              description: "추가 디버그 정보 (선택)"

    # -----------------------------------------------------------------------
    # UserSummary — /me data payload
    # -----------------------------------------------------------------------
    UserSummary:
      type: object
      required:
        - user_id
        - role
        - status
      properties:
        user_id:
          type: string
          description: "OIDC sub 와 매핑되는 내부 식별자"
          example: "alice"
        email:
          type: string
          format: email
          description: "사용자 email — token-only actor (DB row 미존재) 시 token claim 에서 추출"
        display_name:
          type: string
          description: "표시 이름"
          example: "Alice Kim"
        role:
          type: string
          enum:
            - "developer"
            - "manager"
            - "system_admin"
          description: "DevHub 내부 role wire format"
          example: "developer"
        status:
          $ref: "#/components/schemas/AccountStatus"
        idp_subject:
          type: string
          description: "Keycloak OIDC sub claim — ADR-0019 §4.3 idp_subject lazy backfill"
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    # -----------------------------------------------------------------------
    # LogoutData — /auth/logout 200 data payload
    # -----------------------------------------------------------------------
    LogoutData:
      type: object
      required:
        - revoke_status
      properties:
        revoke_status:
          type: string
          enum:
            - "ok"
            - "unreachable"
            - "config_error"
            - "skipped_no_refresh_token"
          description: |
            Keycloak OIDC logout 결과.
            - ok: 정상 폐기
            - unreachable: Keycloak 도달 실패 (marker 부착)
            - config_error: backend config 결함 (marker 미부착, SSO session 정상)
            - skipped_no_refresh_token: refresh_token 미제출로 skip
        hotfix_id:
          type: string
          description: "N-8 hotfix 식별자 — marker 부착 시 포함"
          example: "N-8-4:graceful-degrade"

    # -----------------------------------------------------------------------
    # HealthResponse — /health raw (no envelope)
    # -----------------------------------------------------------------------
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - "ok"
            - "degraded"
          description: "ok | degraded (DB error 시)"
        service:
          type: string
          example: "backend-core"
        db:
          type: string
          enum:
            - "ok"
            - "disabled"
            - "error"
          description: "DB 상태 — disabled (미설정), ok (연결), error (연결 불량)"
        error:
          type: string
          description: "DB error detail — 503 시에만 포함"

    # -----------------------------------------------------------------------
    # AccountStatus enum
    # -----------------------------------------------------------------------
    AccountStatus:
      type: string
      enum:
        - "active"
        - "disabled"
        - "locked"
        - "password_reset_required"
      description: "계정 상태 (docs/api/conventions.md §2.2)"

    # -----------------------------------------------------------------------
    # ErrorCode — string enum subset
    # -----------------------------------------------------------------------
    ErrorCode:
      type: string
      enum:
        - "auth_failed"
        - "auth_row_denied"
        - "internal_error"
        - "oidc_config_missing"
        - "oidc_network_unreachable"
        - "request_id_invalid"
        - "validation_failed"
        - "unauthenticated"
        - "not_found"
        - unavailable: 서비스 일시 불가

    # -----------------------------------------------------------------------
    # PaginatedResponse — generic paginated envelope data
    # -----------------------------------------------------------------------
    PaginatedResponse:
      type: object
      description: |
        Generic paginated response wrapper. Type parameter T omitted — items are plain objects.
        제너릭 페이지네이션 응답. 타입 파라미터는 생략 — items 는 object 배열.
      properties:
        items:
          type: array
          items:
            type: object
          description: "페이지 항목 배열"
        total:
          type: integer
          format: int64
          description: "전체 항목 수"
        limit:
          type: integer
          format: int64
          description: "페이지 당 최대 항목 수"
          example: 50
        offset:
          type: integer
          format: int64
          description: "페이지 offset"
          example: 0

    # =========================================================================
    # Auth / User 도메인
    # =========================================================================

    # -----------------------------------------------------------------------
    # UserSummaryExtended — /me + onboarding fields
    # -----------------------------------------------------------------------
    UserSummaryExtended:
      type: object
      required:
        - user_id
        - role
        - status
      properties:
        id:
          type: integer
          format: int64
          description: "내부 PK (users.id)"
          example: 42
        user_id:
          type: string
          description: "OIDC sub 와 매핑되는 내부 식별자"
          example: "alice"
        email:
          type: string
          format: email
          description: "사용자 email"
          example: "alice@example.com"
        display_name:
          type: string
          description: "표시 이름"
          example: "Alice Kim"
        role:
          $ref: "#/components/schemas/AppRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        type:
          type: string
          description: "사용자 유형 — member / bot / token"
          example: "member"
        primary_unit_id:
          type: string
          description: "주요 소속 조직 unit ID"
          example: "team-platform"
        current_unit_id:
          type: string
          description: "현재 배정된 조직 unit ID (겸임 시 primary 와 다를 수 있음)"
          example: "team-platform"
        is_seconded:
          type: boolean
          description: "겸임 여부"
          example: false
        joined_at:
          type: string
          format: date-time
          description: "가입 일시"
          example: "2026-01-15T09:00:00Z"
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
          description: "온보딩 완료 일시 — 미완료 시 null"
          example: "2026-05-21T08:30:00Z"
        review_status:
          type: string
          nullable: true
          enum:
            - "pending_review"
            - "reviewed"
          description: "관리자 검토 상태 — 미완료 시 null"
          example: "reviewed"

    # -----------------------------------------------------------------------
    # AppRole enum — full role set
    # -----------------------------------------------------------------------
    AppRole:
      type: string
      enum:
        - "developer"
        - "team_manager"
        - "system_admin"
      description: |
        DevHub role wire format.
        - developer: 개발자
        - team_manager: 팀 관리자
        - system_admin: 시스템 관리자

    # -----------------------------------------------------------------------
    # OnboardingSubmissionRequest — POST /me/onboarding body
    # -----------------------------------------------------------------------
    OnboardingSubmissionRequest:
      type: object
      required:
        - display_name
        - primary_unit_id
      properties:
        display_name:
          type: string
          description: "표시 이름 — 1~100자"
          example: "Alice Kim"
        primary_unit_id:
          type: string
          description: "주요 소속 조직 unit ID"
          example: "team-platform"
        role:
          type: string
          description: "role 은 request 단계에서 받지 않음 (claim 매핑 전용)"
          readOnly: true

    # -----------------------------------------------------------------------
    # OnboardingSubmissionResponse — POST /me/onboarding 201
    # -----------------------------------------------------------------------
    OnboardingSubmissionResponse:
      type: object
      properties:
        user_id:
          type: string
          description: "OIDC sub 와 매핑되는 내부 식별자"
          example: "alice"
        email:
          type: string
          format: email
          description: "사용자 email"
          example: "alice@example.com"
        display_name:
          type: string
          description: "표시 이름"
          example: "Alice Kim"
        primary_unit_id:
          type: string
          description: "주요 소속 조직 unit ID"
          example: "team-platform"
        role:
          $ref: "#/components/schemas/AppRole"
        onboarding_required:
          type: boolean
          description: "온보딩 필요 여부"
          example: false
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
          description: "온보딩 완료 일시"
          example: "2026-05-21T08:30:00Z"
        review_status:
          type: string
          nullable: true
          description: "관리자 검토 상태"
          example: "pending_review"

    # -----------------------------------------------------------------------
    # PatchMeRequest — PATCH /me body
    # -----------------------------------------------------------------------
    PatchMeRequest:
      type: object
      properties:
        display_name:
          type: string
          description: "표시 이름 — 1~100자 (선택)"
          example: "Alice K."
        email:
          type: string
          format: email
          description: "이메일 주소 (선택)"
          example: "alice@newdomain.com"
        primary_unit_id:
          type: string
          description: "주요 소속 조직 unit ID (선택)"
          example: "team-data"

    # -----------------------------------------------------------------------
    # AuthError — auth-failure response envelope
    # -----------------------------------------------------------------------
    AuthError:
      type: object
      description: |
        인증 실패 응답. code 필드로 구체적 실패 원인 식별.
        Auth failure response. Use code field to discriminate.
      properties:
        code:
          type: string
          enum:
            - "auth_failed"
            - "auth_row_denied"
            - "unauthenticated"
            - "unauthorized"
